<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIBA MYITTA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

/* ===================== BASE ===================== */

*{margin:0;padding:0;box-sizing:border-box;}

:root{
--pink:#ff2ea6;
--purple:#7a5cff;
--cyan:#3cf2ff;
--bg:#0a0a12;
--text:#fff;
--muted:#a9a9c7;
}

body{
font-family:'Inter','Myanmar Text',sans-serif;
background:
radial-gradient(circle at top left,rgba(122,92,255,.25),transparent 30%),
radial-gradient(circle at top right,rgba(255,46,166,.18),transparent 30%),
linear-gradient(180deg,#09090f 0%,#12121d 100%);
color:var(--text);
min-height:100vh;
padding-bottom:4rem;
}

/* ===================== TOP ===================== */

.topbar{
position:sticky;
top:0;
z-index:999;
padding:1rem;
backdrop-filter:blur(16px);
background:rgba(10,10,20,.6);
border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
max-width:900px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:1.4rem;
font-weight:800;
}

.logo span{
background:linear-gradient(90deg,var(--pink),var(--cyan));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-icons{
display:flex;
gap:.6rem;
}

.nav-icons button,
.nav-icons a{
width:40px;height:40px;
border-radius:50%;
border:none;
background:rgba(255,255,255,.06);
color:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* ===================== HERO ===================== */

.container{max-width:900px;margin:auto;padding:1rem;}

.hero{
text-align:center;
padding:2rem 1rem;
border-radius:28px;
background:rgba(20,20,40,.6);
border:1px solid rgba(255,255,255,.08);
}

.hero img{
width:80px;height:80px;
border-radius:50%;
border:2px solid var(--pink);
}

.shop-name{font-size:1.6rem;font-weight:800;margin-top:1rem;}
.sub-name{color:var(--cyan);font-size:.9rem;}

.search-box{
margin:1rem 0;
display:flex;
gap:.5rem;
}

.search-box input{
flex:1;
padding:.7rem;
border-radius:12px;
border:none;
outline:none;
}

.filter{
padding:.7rem;
border-radius:12px;
border:none;
}

/* ===================== GRID ===================== */

.product-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:1rem;
margin-top:1rem;
}

.card{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:20px;
overflow:hidden;
cursor:pointer;
position:relative;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
}

.card-body{padding:.8rem;}

.price{
color:var(--cyan);
font-weight:700;
margin-top:.3rem;
}

.discount{
position:absolute;
top:10px;
left:10px;
background:var(--pink);
padding:.2rem .5rem;
border-radius:10px;
font-size:.7rem;
}

.heart{
position:absolute;
top:10px;
right:10px;
cursor:pointer;
}

/* ===================== MODAL ===================== */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
}

.modal img{
max-width:90%;
max-height:70%;
}

.modal .box{
background:#111;
padding:1rem;
border-radius:15px;
margin-top:1rem;
}

/* ===================== FLOAT ===================== */

.float{
position:fixed;
bottom:20px;
right:20px;
background:linear-gradient(90deg,var(--pink),var(--purple));
width:55px;height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

/* ===================== TOAST ===================== */

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:.7rem 1rem;
border-radius:20px;
opacity:0;
transition:.3s;
}

</style>
</head>

<body>

<div class="topbar">
<div class="topbar-inner">
<div class="logo"><span>MIBA</span> MYITTA</div>

<div class="nav-icons">
<a href="https://t.me/mibamyitta1"><i class="fab fa-telegram"></i></a>
<button onclick="toggleDark()">🌙</button>
</div>

</div>
</div>

<div class="container">

<div class="hero">

<img src="https://i.ibb.co/35gzXLbQ/IMG.png">

<div class="shop-name">မိဘမေတ္တာ</div>
<div class="sub-name">အထည်ဆိုင်</div>

<div class="search-box">
<input id="search" placeholder="Search product...">
<select class="filter" id="filter">
<option value="all">All</option>
<option value="shirt">Shirt</option>
<option value="hoodie">Hoodie</option>
</select>
</div>

</div>

<div class="product-grid" id="grid"></div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
<img id="mimg">
<div class="box" id="mbox"></div>
<button onclick="closeM()">Close</button>
</div>

<div class="float" onclick="window.open('https://t.me/mibamyitta1')">
<i class="fab fa-telegram"></i>
</div>

<div class="toast" id="toast"></div>

<script>

const API="/api/posts";
let posts=[];

async function load(){
const res=await fetch(API);
const data=await res.json();
posts=data.posts||[];
render(posts);
}

function render(list){
let html="";
list.forEach(p=>{

let price=p.price||"";
let discount=p.discount||"";

html+=`
<div class="card" onclick="openM('${p.image_url}','${p.caption||''}','${price}')">

${discount?`<div class="discount">${discount}%</div>`:""}

<div class="heart" onclick="fav(event,'${p.id}')">❤️</div>

<img src="${p.image_url}">

<div class="card-body">
<div>${p.caption||""}</div>
<div class="price">${price}</div>
</div>

</div>
`;
});

document.getElementById("grid").innerHTML=html;
}

function openM(img,text,price){
document.getElementById("modal").style.display="flex";
document.getElementById("mimg").src=img;
document.getElementById("mbox").innerHTML=`${text}<br><b>${price}</b>`;
}

function closeM(){
document.getElementById("modal").style.display="none";
}

function toggleDark(){
document.body.classList.toggle("dark");
toast("Mode changed");
}

function toast(t){
let el=document.getElementById("toast");
el.innerText=t;
el.style.opacity=1;
setTimeout(()=>el.style.opacity=0,2000);
}

function fav(e,id){
e.stopPropagation();
let f=JSON.parse(localStorage.getItem("fav")||"[]");
if(!f.includes(id)) f.push(id);
localStorage.setItem("fav",JSON.stringify(f));
toast("Saved ❤️");
}

document.getElementById("search").addEventListener("input",e=>{
let v=e.target.value.toLowerCase();
render(posts.filter(p=> (p.caption||"").toLowerCase().includes(v)));
});

load();

</script>

</body>
</html>

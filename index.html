<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>မိဘမေတ္တာ - အထည်ဆိုင်</title>
    
    <meta name="google-site-verification" content="NLqyHByZ-OnqMIKZDidDeUzfNeXN8-SfJElHoPqbrY8" />
    
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="မိဘမေတ္တာ">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <meta name="theme-color" content="#8b5a2b">
    <meta name="description" content="မိဘမေတ္တာ အထည်ဆိုင် - အရည်အသွေးမြင့် အထည်များ">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5a2b;
            --bg: #fdf8f0;
            --bg-secondary: #f5e8d8;
            --card: #ffffff;
            --text: #3d2b1a;
            --text-light: #7a5a4e;
            --text-muted: #b0a090;
            --border: #f0e0d0;
            --shadow: 0 2px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
            --radius: 20px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a2e;
                --bg-secondary: #16213e;
                --card: #0f3460;
                --text: #e0d5c0;
                --text-light: #c0b090;
                --text-muted: #8a7a60;
                --border: #2a3050;
                --shadow: 0 2px 16px rgba(0,0,0,0.3);
                --shadow-lg: 0 8px 32px rgba(0,0,0,0.4);
            }
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, 'Myanmar Text', -apple-system, sans-serif;
            background: linear-gradient(160deg, var(--bg) 0%, var(--bg-secondary) 40%, var(--bg) 100%);
            min-height: 100vh; min-height: 100dvh;
            padding: 16px; padding-bottom: 32px;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            color: var(--text);
            overscroll-behavior-y: contain;
        }
        
        .container { max-width: 560px; margin: 0 auto; }
        
        .pull-indicator { text-align: center; padding: 12px; color: var(--text-muted); font-size: 13px; display: none; }
        .pull-indicator.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        
        .dark-mode-toggle { position: fixed; bottom: 20px; right: 20px; width: 48px; height: 48px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow-lg); border: none; cursor: pointer; z-index: 100; font-size: 20px; display: flex; align-items: center; justify-content: center; }
        
        .header-card { background: linear-gradient(145deg, #ffffff 0%, #fefaf5 100%); border-radius: 24px; padding: 24px 20px 20px; margin-bottom: 16px; box-shadow: var(--shadow-lg); text-align: center; position: relative; overflow: hidden; }
        .header-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, #8b5a2b, #c4956a, #8b5a2b); }
        .shop-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; box-shadow: 0 4px 12px rgba(139,90,43,0.2); cursor: default; user-select: none; -webkit-user-select: none; }
        .shop-name { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; cursor: default; user-select: none; -webkit-user-select: none; }
        .shop-name small { font-size: 14px; font-weight: 500; color: #a0724d; display: block; }
        .welcome-badge { display: inline-block; background: #fef5e8; color: #b8863f; font-size: 13px; font-weight: 600; padding: 6px 20px; border-radius: 50px; margin: 10px 0; }
        .contact-row { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 10px; }
        .contact-item { font-size: 12px; color: var(--text-light); background: #fef9f3; padding: 6px 14px; border-radius: 50px; display: flex; align-items: center; gap: 6px; }
        .contact-item i { color: var(--primary); font-size: 13px; }
        
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 16px; border-radius: 16px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; text-decoration: none; transition: var(--transition); -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: scale(0.96); }
        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-viber { background: #7360f2; color: #fff; }
        .btn-install { background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff; grid-column: 1 / -1; display: none; font-size: 15px; box-shadow: 0 4px 16px rgba(39,174,96,0.25); animation: pulse 2.5s infinite; }
        @keyframes pulse { 0%, 100% { box-shadow: 0 4px 16px rgba(39,174,96,0.25); } 50% { box-shadow: 0 6px 24px rgba(39,174,96,0.4); } }
        .installed-badge { text-align: center; background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 16px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; }
        
        .install-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; }
        .install-section img { width: 72px; height: 72px; border-radius: 12px; flex-shrink: 0; }
        .install-section .info { flex: 1; }
        .install-section .info p { font-size: 13px; color: var(--text-light); font-weight: 500; }
        .install-section .info small { font-size: 11px; color: var(--text-muted); }
        
        .admin-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
        .admin-badge { background: #1a1a2e; color: #fff; padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; }
        .admin-logout { background: none; border: 1px solid #ddd; color: #999; padding: 6px 14px; border-radius: 50px; font-size: 11px; cursor: pointer; }
        
        .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .post-count { font-size: 12px; color: var(--text-muted); }
        .refresh-btn { background: var(--card); border: 1px solid var(--border); color: var(--primary); padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        
        .post-card { background: var(--card); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); position: relative; animation: fadeSlideUp 0.4s ease-out; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .post-image-wrap { position: relative; cursor: pointer; overflow: hidden; background: #f5f0ea; }
        .post-image-wrap img { width: 100%; display: block; transition: transform 0.3s ease; }
        .post-image-wrap:active img { transform: scale(1.03); }
        .post-image-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.75)); color: #fff; padding: 32px 16px 14px; font-size: 14px; line-height: 1.5; pointer-events: none; }
        .post-text-content { padding: 20px; font-size: 15px; color: var(--text); line-height: 1.7; }
        .post-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); }
        .post-footer-left { display: flex; align-items: center; gap: 10px; }
        .post-date { font-size: 11px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .post-type-badge { font-size: 10px; background: #fef5e8; color: var(--primary); padding: 3px 10px; border-radius: 50px; font-weight: 600; }
        .share-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 50px; }
        .share-btn:active { color: var(--primary); background: #fef5e8; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; border: none; border-radius: 50px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 10; }
        
        .skeleton { background: linear-gradient(90deg, #f0e0d0 25%, #f5ece0 50%, #f0e0d0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton-card { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
        .skeleton-img { width: 100%; height: 250px; }
        .skeleton-footer { padding: 12px 16px; display: flex; justify-content: space-between; }
        .skeleton-badge { width: 50px; height: 20px; border-radius: 50px; }
        .skeleton-date { width: 80px; height: 14px; }
        
        .status-card { text-align: center; padding: 48px 24px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); color: var(--text-muted); }
        .retry-btn { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 12px; font-size: 14px; }
        
        .viewer-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.96); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }
        .viewer-overlay.active { display: flex; }
        .viewer-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 32px; z-index: 2001; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); border-radius: 50%; border: none; cursor: pointer; }
        .viewer-image-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 0; overflow: auto; touch-action: pan-x pan-y pinch-zoom; width: 100%; }
        .viewer-image-wrap img { max-width: 90%; max-height: 75vh; object-fit: contain; border-radius: 8px; }
        .viewer-caption { color: #fff; text-align: center; padding: 8px 24px 24px; font-size: 14px; max-width: 500px; }
        
        .login-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; }
        .login-overlay.active { display: flex; }
        .login-box { background: var(--card); border-radius: 24px; padding: 32px 24px; width: 90%; max-width: 360px; text-align: center; }
        .login-box h3 { color: var(--primary); margin-bottom: 4px; }
        .login-box p { color: #999; font-size: 13px; margin-bottom: 20px; }
        .login-box input { width: 100%; padding: 14px; border: 2px solid #eee; border-radius: 14px; font-size: 16px; text-align: center; outline: none; background: var(--bg); color: var(--text); }
        .login-box input:focus { border-color: var(--primary); }
        .login-box .btn-row { display: flex; gap: 10px; margin-top: 16px; }
        .btn-login { flex: 1; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 50px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .btn-cancel { flex: 1; background: #f0f0f0; color: #666; border: none; padding: 12px; border-radius: 50px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .login-error { color: #e74c3c; font-size: 12px; margin-top: 10px; display: none; }
        .new-post-badge { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #e74c3c; color: #fff; padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700; cursor: pointer; z-index: 50; display: none; }
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 50px; font-size: 13px; z-index: 4000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="new-post-badge" id="newPostBadge" onclick="loadPosts()">🆕 ပို့စ်သစ်ရှိသည်</div>
    <div class="pull-indicator" id="pullIndicator">⬇️ ဆွဲချပြီး ပြန်စတင်ပါ</div>

    <div class="header-card">
        <img class="shop-logo" src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" alt="Logo">
        <div class="shop-name">မိဘမေတ္တာ <small>အထည်ဆိုင်</small></div>
        <div class="welcome-badge">🙏 မင်္ဂလာပါ ကြိုဆိုပါတယ် 🙏</div>
        <div class="contact-row">
            <span class="contact-item"><i class="fas fa-phone"></i> 09697455880</span>
            <span class="contact-item"><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
    </div>

    <!-- Action Buttons (HTML Direct Links - No JavaScript) -->
    <div class="action-buttons">
        <a href="https://t.me/mibamittaa" class="btn btn-telegram" target="_blank" rel="noopener noreferrer"><i class="fab fa-telegram-plane"></i> Telegram</a>
        <a href="viber://chat?number=%2B959697455880" class="btn btn-viber" target="_blank" rel="noopener noreferrer"><i class="fab fa-viber"></i> Viber</a>
        <a href="#" class="btn btn-install" id="installBtn" onclick="installApp()"><i class="fas fa-download"></i> အက်ပ် ထည့်သွင်းရန်</a>
    </div>
    <div class="installed-badge" id="installedBadge">✅ အက်ပ် ထည့်သွင်းပြီးပါပြီ</div>

    <div class="install-section">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://mibbamitta.pages.dev" alt="QR">
        <div class="info">
            <p>📲 အက်ပ်ထည့်ရန် QR Scan လုပ်ပါ</p>
            <small>Chrome Browser ဖြင့် Scan လုပ်ပါ</small>
        </div>
    </div>

    <div id="adminBar"></div>

    <div class="refresh-bar">
        <span class="post-count" id="postCount"></span>
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>

    <div id="postGrid"></div>
</div>

<button class="dark-mode-toggle" onclick="toggleDarkMode()"><span id="darkIcon">🌙</span></button>

<div class="viewer-overlay" id="imageViewer">
    <button class="viewer-close" onclick="closeViewer()">&times;</button>
    <div class="viewer-image-wrap"><img id="viewerImage" src="" alt="ပုံအကြီး"></div>
    <div class="viewer-caption" id="viewerCaption"></div>
</div>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <div style="font-size:40px;">🔐</div>
        <h3>Admin Login</h3>
        <p>Password ထည့်ပါ</p>
        <input type="password" id="loginPassword" placeholder="••••••••" onkeypress="if(event.key==='Enter')adminLogin()">
        <div class="btn-row">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const WORKER_URL = "https://misty-scene-5b01.waimyolinnaoehtein.workers.dev";
    let lastPostId = 0;
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = adminToken ? true : false;
    let deferredPrompt;
    let currentScale = 1;
    let initialDist = 0;
    let longPressTimer;
    let darkMode = localStorage.getItem('darkMode') === 'true';
    let pullStart = 0;
    
    // ==================== Service Worker ====================
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    
    // ==================== Dark Mode ====================
    if (darkMode) document.documentElement.setAttribute('data-dark', 'true');
    updateDarkIcon();
    function toggleDarkMode() {
        darkMode = !darkMode; localStorage.setItem('darkMode', darkMode);
        darkMode ? document.documentElement.setAttribute('data-dark', 'true') : document.documentElement.removeAttribute('data-dark');
        updateDarkIcon();
    }
    function updateDarkIcon() { document.getElementById('darkIcon').textContent = darkMode ? '☀️' : '🌙'; }
    
    // ==================== Toast ====================
    function showToast(msg) {
        const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
    
    // ==================== PWA Install ====================
    const installBtn = document.getElementById('installBtn');
    const installedBadge = document.getElementById('installedBadge');
    if (window.matchMedia('(display-mode: standalone)').matches) installedBadge.style.display = 'block';
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex'; });
    function installApp() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(r => { if (r.outcome === 'accepted') { installBtn.style.display = 'none'; installedBadge.style.display = 'block'; } deferredPrompt = null; });
    }
    window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; installedBadge.style.display = 'block'; });
    
    // ==================== Admin ====================
    if (isAdmin) showAdminBar();
    const logo = document.querySelector('.shop-logo');
    logo.addEventListener('touchstart', e => { if(!isAdmin) longPressTimer = setTimeout(showLogin, 3000); });
    logo.addEventListener('touchend', () => clearTimeout(longPressTimer));
    logo.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    logo.addEventListener('mousedown', e => { if(!isAdmin) longPressTimer = setTimeout(showLogin, 3000); });
    logo.addEventListener('mouseup', () => clearTimeout(longPressTimer));
    logo.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
    
    function showLogin() {
        document.getElementById('loginOverlay').classList.add('active');
        document.getElementById('loginPassword').focus();
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginPassword').value = '';
    }
    function closeLogin() { document.getElementById('loginOverlay').classList.remove('active'); }
    
    async function adminLogin() {
        const pw = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');
        if (!pw) { err.style.display = 'block'; err.textContent = 'Password ထည့်ပါ'; return; }
        try {
            const res = await fetch(`${WORKER_URL}/admin/login`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw })
            });
            const data = await res.json();
            if (data.success) {
                adminToken = data.token; localStorage.setItem('adminToken', adminToken); isAdmin = true;
                closeLogin(); showAdminBar(); loadPosts();
            } else { err.style.display = 'block'; err.textContent = '❌ Password မှားနေပါသည်'; }
        } catch(e) { err.style.display = 'block'; err.textContent = '❌ ချိတ်ဆက်မှု မအောင်မြင်ပါ'; }
    }
    
    function showAdminBar() {
        document.getElementById('adminBar').innerHTML = `<div class="admin-bar"><div class="admin-badge">🔐 Admin Mode</div><button class="admin-logout" onclick="adminLogout()">ထွက်မည်</button></div>`;
    }
    function adminLogout() { adminToken = null; isAdmin = false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML = ''; loadPosts(); }
    
    // ==================== Delete ====================
    async function deletePost(postId) {
        if (!confirm("ဖျက်မှာလား?")) return;
        try {
            const res = await fetch(`${WORKER_URL}/post/${postId}`, { method: 'DELETE', headers: { 'Authorization': `Bearer ${adminToken}` } });
            const data = await res.json();
            if (data.success) { loadPosts(); showToast('✅ ဖျက်ပြီးပါပြီ'); }
            else if (data.error?.includes('ခွင့်မပြု')) { alert("သက်တမ်းကုန်ပါပြီ။"); adminLogout(); }
        } catch(e) { alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ"); }
    }
    
    // ==================== Share ====================
    function sharePost(post) {
        const text = post.type === 'photo' ? (post.caption || 'ပုံ') : (post.text || 'စာသား');
        if (navigator.share) navigator.share({ title: 'မိဘမေတ္တာ', text: text.substring(0, 100) });
        else { navigator.clipboard?.writeText(text); showToast('📋 ကူးယူပြီးပါပြီ'); }
    }
    
    // ==================== Format ====================
    function formatDate(ts) {
        if (!ts) return "";
        const d = new Date(ts * 1000);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${d.getDate()} ${months[d.getMonth()]} '${d.getFullYear().toString().slice(2)} · ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }
    function escapeHtml(t) {
        if (!t) return "";
        const m = { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;','`':'&#96;' };
        return t.replace(/[&<>"'`]/g, c => m[c]);
    }
    
    // ==================== Load Posts ====================
    async function loadPosts(showSkeleton = true) {
        const grid = document.getElementById('postGrid');
        if (showSkeleton) {
            grid.innerHTML = '';
            for (let i = 0; i < 3; i++) grid.innerHTML += `<div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-footer"><div class="skeleton skeleton-badge"></div><div class="skeleton skeleton-date"></div></div></div>`;
        }
        
        try {
            const res = await fetch(`${WORKER_URL}/posts`);
            const data = await res.json();
            if (!data.success) throw new Error("API Error");
            
            const posts = data.posts || [];
            document.getElementById('postCount').textContent = posts.length ? `ပို့စ် ${posts.length} ခု` : '';
            if (posts.length > 0 && posts[0].id > lastPostId && lastPostId > 0) document.getElementById('newPostBadge').style.display = 'block';
            if (posts.length > 0) lastPostId = posts[0].id;
            if (!posts.length) { grid.innerHTML = '<div class="status-card"><p>📭 ပို့စ်မရှိသေးပါ</p></div>'; return; }
            
            let html = '';
            posts.forEach((post, i) => {
                const dateStr = formatDate(post.date);
                const deleteBtn = isAdmin ? `<button class="delete-btn" onclick="event.stopPropagation();deletePost(${post.id})"><i class="fas fa-trash"></i> ဖျက်ရန်</button>` : '';
                const caption = post.caption || '';
                const safeCaption = escapeHtml(caption);
                
                if (post.type === 'photo') {
                    html += `<div class="post-card" style="animation-delay:${i * 0.05}s">${deleteBtn}<div class="post-image-wrap" onclick="openViewer('${post.image_url}','${safeCaption}')"><img src="${post.image_url}" alt="ပုံ" loading="lazy">${caption ? `<div class="post-image-caption">${safeCaption}</div>` : ''}</div><div class="post-footer"><div class="post-footer-left"><span class="post-type-badge">📷 ပုံ</span><span class="post-date"><i class="far fa-clock"></i> ${dateStr}</span></div><button class="share-btn" onclick="event.stopPropagation();sharePost({type:'photo',caption:'${safeCaption}',image_url:'${post.image_url}'})"><i class="fas fa-share-alt"></i></button></div></div>`;
                } else {
                    html += `<div class="post-card" style="animation-delay:${i * 0.05}s">${deleteBtn}<div class="post-text-content">${escapeHtml(post.text || '')}</div><div class="post-footer"><div class="post-footer-left"><span class="post-type-badge">📝 စာသား</span><span class="post-date"><i class="far fa-clock"></i> ${dateStr}</span></div><button class="share-btn" onclick="event.stopPropagation();sharePost({type:'text',text:'${escapeHtml(post.text||'')}'})"><i class="fas fa-share-alt"></i></button></div></div>`;
                }
            });
            grid.innerHTML = html;
        } catch(e) {
            grid.innerHTML = `<div class="status-card"><p>❌ ချို့ယွင်းနေပါသည်</p><small>အင်တာနက်စစ်ဆေးပါ</small><br><button class="retry-btn" onclick="loadPosts()"><i class="fas fa-redo"></i> ပြန်ကြိုးစားမည်</button></div>`;
        }
    }
    
    // ==================== Image Viewer ====================
    function openViewer(src, caption) {
        const v = document.getElementById('imageViewer');
        document.getElementById('viewerImage').src = src;
        document.getElementById('viewerImage').style.transform = 'scale(1)';
        currentScale = 1;
        document.getElementById('viewerCaption').textContent = caption || '';
        v.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeViewer() { document.getElementById('imageViewer').classList.remove('active'); document.body.style.overflow = ''; }
    
    document.getElementById('imageViewer').addEventListener('touchstart', e => {
        if (e.touches.length === 2) initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    });
    document.getElementById('imageViewer').addEventListener('touchmove', e => {
        if (e.touches.length === 2) {
            e.preventDefault();
            document.getElementById('viewerImage').style.transform = `scale(${Math.min(Math.max(Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY) / initialDist, 1), 5)})`;
        }
    }, { passive: false });
    
    // ==================== Pull to Refresh ====================
    document.addEventListener('touchstart', e => { pullStart = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchmove', e => {
        if (e.touches[0].clientY - pullStart > 60 && window.scrollY === 0) document.getElementById('pullIndicator').classList.add('show');
    }, { passive: true });
    document.addEventListener('touchend', () => {
        if (document.getElementById('pullIndicator').classList.contains('show')) {
            document.getElementById('pullIndicator').classList.remove('show');
            document.getElementById('newPostBadge').style.display = 'none';
            loadPosts();
        }
    });
    
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
    
    // ==================== Init ====================
    loadPosts();
    console.log('🚀 Final Version | HTML Direct Links');
</script>

</body>
</html>

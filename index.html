<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIBA MYITTA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f051d">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff007a;
            --secondary: #bc13fe;
            --accent: #00f2ff;
            --bg: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --neon-shadow: 0 0 15px rgba(255, 0, 122, 0.5);
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --glass: rgba(0, 0, 0, 0.05);
            --text: #1a1a1a;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #2a0a4a 0%, var(--bg) 70%);
            color: var(--text);
            transition: all 0.3s;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .topbar {
            position: sticky;
            top: 0;
            background: rgba(15, 5, 29, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .topbar-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: var(--neon-shadow); }
        .nav-icons { display: flex; gap: 1.5rem; align-items: center; }
        .nav-icons a, .nav-icons button { color: var(--text); text-decoration: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        .nav-icons a:hover { color: var(--primary); transform: scale(1.1); }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
        .hero { text-align: center; padding: 3rem 1rem; position: relative; overflow: hidden; }
        .hero img { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 1.5rem; box-shadow: 0 0 30px rgba(255, 0, 122, 0.3); }
        .hero h1 { margin: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; }
        .shop-sub { font-size: 1.2rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 3px; }
        .contact-info { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.95rem; }
        .contact-info span { display: flex; align-items: center; gap: 0.6rem; background: var(--glass); padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1); }
        
        .action-row { display: flex; justify-content: space-between; align-items: center; margin: 2rem 0 1.5rem; }
        .section-title { font-size: 1.2rem; font-weight: 700; color: var(--text); border-left: 4px solid var(--primary); padding-left: 1rem; }
        .refresh-btn { background: var(--primary); color: white; border: none; padding: 0.6rem 1.2rem; border-radius: 0.8rem; font-weight: 600; cursor: pointer; box-shadow: var(--neon-shadow); transition: 0.3s; }
        .refresh-btn:active { transform: scale(0.95); }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; }
        .card { background: var(--card-bg); border-radius: 1.5rem; overflow: hidden; position: relative; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card-img { width: 100%; aspect-ratio: 1/1; overflow: hidden; position: relative; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .card:hover .card-img img { transform: scale(1.1); }
        .card-info { padding: 1.2rem; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); position: absolute; bottom: 0; left: 0; right: 0; }
        .card-caption { font-size: 0.95rem; font-weight: 500; color: #fff; margin-bottom: 0.5rem; }
        .card-price { color: var(--accent); font-weight: 700; font-size: 1.1rem; }
        
        .text-card { background: var(--card-bg); border-radius: 1.5rem; padding: 2rem; border: 1px solid rgba(255,255,255,0.1); grid-column: 1 / -1; backdrop-filter: blur(10px); }
        
        .delete-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,0,0,0.6); color: white; border: none; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; backdrop-filter: blur(5px); }

        /* Viewer Styles */
        .viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; backdrop-filter: blur(15px); }
        .viewer-top { position: absolute; top: 0; left: 0; right: 0; padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 2100; }
        .viewer-close, .viewer-save { background: var(--glass); border: 1px solid rgba(255,255,255,0.2); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.3s; }
        .viewer-close:hover, .viewer-save:hover { background: var(--primary); border-color: var(--primary); }
        .viewer-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .viewer-slider { display: flex; flex-direction: column; height: 100%; width: 100%; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .viewer-slide { min-height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .viewer-slide img { max-width: 95%; max-height: 85%; object-fit: contain; transition: transform 0.1s ease-out; border-radius: 1rem; box-shadow: 0 0 50px rgba(0,0,0,0.5); }
        .viewer-caption { position: absolute; bottom: 40px; left: 20px; right: 20px; background: var(--glass); color: white; padding: 1.5rem; border-radius: 1.5rem; font-size: 1rem; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); text-align: center; }

        /* Custom Loading Screen */
        #loadingScreen { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .loading-logo { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 2rem; box-shadow: 0 0 40px rgba(255, 0, 122, 0.4); animation: pulse 2s infinite; }
        .loading-text { color: #fff; font-weight: 900; letter-spacing: 5px; font-size: 1.5rem; text-shadow: var(--neon-shadow); }
        @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 122, 0.2); } 50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(255, 0, 122, 0.6); } 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 0, 122, 0.2); } }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 12px 25px; border-radius: 3rem; font-size: 0.95rem; font-weight: 600; z-index: 4000; display: none; box-shadow: var(--neon-shadow); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        
        .skeleton-card { background: var(--card-bg); aspect-ratio: 1/1; border-radius: 1.5rem; animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

<div id="loadingScreen">
    <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" class="loading-logo">
    <div class="loading-text">MIBA MYITTA</div>
</div>

<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA MYITTA</div>
        <div class="nav-icons">
            <a href="https://t.me/mibamyitta1" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</div>

<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" id="adminLogo">
        <h1>မိဘမေတ္တာ</h1>
        <div class="shop-sub">Premium Collection</div>
        <div class="contact-info">
            <span><i class="fas fa-phone"></i> 09697455880</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
    </div>
    
    <div class="action-row">
        <div class="section-title">Explore Art Work</div>
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    
    <div id="postGrid" class="product-grid"></div>
</div>

<div id="imageViewer" class="viewer">
    <div class="viewer-top">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
        <button class="viewer-save" onclick="saveImage()"><i class="fas fa-download"></i></button>
    </div>
    <div class="viewer-container" id="viewerContainer">
        <div class="viewer-slider" id="viewerSlider"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API = '/api';
    let allPosts = [];
    let currentViewerIndex = 0;
    let isAdmin = false;
    let isZoomed = false;

    // Theme
    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }
    if(localStorage.getItem('theme') === 'light') document.body.setAttribute('data-theme', 'light');

    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function openViber() { window.location.href = "viber://pa?chatURI=mibamyitta"; }

    // Admin Check
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('admin') === 'true') {
        isAdmin = true;
        document.getElementById('adminBar').innerHTML = '<div style="background:var(--primary);color:white;text-align:center;padding:5px;font-size:0.8rem;font-weight:bold;">ADMIN MODE ACTIVE</div>';
    }

    window.deletePost = async (postId) => {
        if(!confirm('ဖျက်မှာ သေချာလား?')) return;
        const token = prompt('Admin Token:');
        if(!token) return;
        try {
            const res = await fetch(`${API}/posts?id=${postId}`, {
                method: 'DELETE',
                headers: { 'Authorization': token }
            });
            const data = await res.json();
            if(data.success) {
                allPosts = allPosts.filter(p => p.id != postId);
                const element = document.getElementById(`post-${postId}`);
                if (element) {
                    element.style.opacity = '0';
                    element.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        element.remove();
                        if(allPosts.length === 0) renderPosts();
                    }, 300);
                }
                toast('✅ Deleted Successfully'); 
            } else toast('❌ ' + (data.error || 'error'));
        } catch(e) { toast('❌ Connection Error'); }
    };

    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    // Viewer with Zoom & Swipe Logic
    function openViewer(index) {
        if(!allPosts.length) return;
        currentViewerIndex = index;
        const viewer = document.getElementById('imageViewer');
        const slider = document.getElementById('viewerSlider');
        slider.innerHTML = '';
        
        allPosts.forEach((post, i) => {
            if(post.type !== 'photo') return;
            const slide = document.createElement('div');
            slide.className = 'viewer-slide';
            const img = document.createElement('img');
            img.src = post.image_url;
            img.id = `viewer-img-${i}`;
            
            const cap = document.createElement('div');
            cap.className = 'viewer-caption';
            cap.innerText = post.caption || '';
            
            slide.appendChild(img);
            slide.appendChild(cap);
            slider.appendChild(slide);
            
            setupZoom(img);
        });

        slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
        viewer.style.display = 'flex';
        history.pushState({viewer:true},'');
        
        let startY = 0;
        slider.ontouchstart = (e) => { 
            if(isZoomed) return; // Disable swipe when zoomed
            if(e.touches.length === 1) startY = e.touches[0].clientY; 
        };
        slider.ontouchend = (e) => {
            if(isZoomed) return;
            if(e.changedTouches.length === 1) {
                const endY = e.changedTouches[0].clientY;
                const diff = startY - endY;
                if(Math.abs(diff) > 50) {
                    if(diff > 0 && currentViewerIndex < slider.children.length-1) currentViewerIndex++;
                    else if(diff < 0 && currentViewerIndex > 0) currentViewerIndex--;
                    slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
                }
            }
        };
    }

    function setupZoom(img) {
        let scale = 1;
        let lastScale = 1;
        let startDist = 0;
        
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        img.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                scale = Math.min(Math.max(1, lastScale * (dist / startDist)), 4);
                img.style.transform = `scale(${scale})`;
                isZoomed = scale > 1.05;
            }
        });

        img.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                lastScale = scale;
                if(scale <= 1.1) {
                    scale = 1;
                    lastScale = 1;
                    img.style.transform = `scale(1)`;
                    isZoomed = false;
                }
            }
        });
    }

    window.saveImage = async () => {
        const currentImg = document.querySelector(`#viewer-img-${currentViewerIndex}`);
        if(!currentImg) return;
        
        toast('⏳ သိမ်းဆည်းနေပါသည်...');
        
        try {
            // Method 1: Fetch and Blob
            const response = await fetch(currentImg.src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `miba-myitta-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            toast('✅ ပုံသိမ်းပြီးပါပြီ');
        } catch (e) {
            // Method 2: Fallback to opening in new tab
            console.error('Save error:', e);
            toast('⚠️ တိုက်ရိုက်သိမ်းမရပါ။ ပုံကို ဖိထားပြီး သိမ်းပေးပါ');
            setTimeout(() => {
                window.open(currentImg.src, '_blank');
            }, 1500);
        }
    };

    window.closeViewer = function() { 
        document.getElementById('imageViewer').style.display='none'; 
        isZoomed = false;
        document.querySelectorAll('.viewer-slide img').forEach(img => {
            img.style.transform = 'scale(1)';
        });
    };

    function renderPosts() {
        const grid=document.getElementById('postGrid');
        if(allPosts.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-muted);">📭 No items found</div>'; return; }
        let html='';
        allPosts.forEach((p, idx) => {
            const delBtn=isAdmin?`<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i></button>`:'';
            if(p.type==='photo'){
                html+=`<div class="card" id="post-${p.id}" onclick="openViewer(${idx})">
                            ${delBtn}
                            <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div>
                            <div class="card-info">
                                <div class="card-caption">${escapeHtml(p.caption || '')}</div>
                                <div class="card-price">Premium</div>
                            </div>
                        </div>`;
            } else {
                html+=`<div class="text-card" id="post-${p.id}">${delBtn}<div class="card-caption">📄 ${escapeHtml(p.text||'')}</div></div>`;
            }
        });
        grid.innerHTML=html;
    }

    async function loadPosts(){
        try{
            const res=await fetch(API+'/posts');
            const data=await res.json();
            if(!data.success) throw new Error('API error');
            allPosts = data.posts || [];
            renderPosts();
            setTimeout(() => {
                const ls = document.getElementById('loadingScreen');
                ls.style.opacity = '0';
                setTimeout(() => ls.style.display = 'none', 500);
            }, 1000);
        } catch(e){ 
            console.error('Load error:', e);
            document.getElementById('postGrid').innerHTML='<div style="text-align:center;padding:2rem;">❌ Connection Error<br><button class="refresh-btn" style="margin-top:1rem" onclick="loadPosts()">Retry</button></div>'; 
            document.getElementById('loadingScreen').style.display = 'none';
        }
    }

    window.addEventListener('popstate', () => { if(document.getElementById('imageViewer').style.display === 'flex') closeViewer(); });
    
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error', err));
        });
    }

    loadPosts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MIBA MYITTA – မိဘမေတ္တာ</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Myanmar Text', sans-serif;
            background: #0a0a0f;
            color: #eef0f5;
            padding-bottom: 2rem;
        }
        body.light {
            background: #fefaf5;
            color: #1e1a1c;
        }
        body.light .card,
        body.light .hero,
        body.light .topbar,
        body.light .login-box {
            background: #ffffff;
            border-color: #e0cfc6;
        }
        .topbar {
            padding: 0.8rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #84102d;
        }
        body.light .topbar {
            background: rgba(255, 255, 245, 0.92);
            border-bottom-color: #e0cfc6;
        }
        .topbar-inner {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e6d3, #b5ac8a, #84102d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-icons {
            display: flex;
            gap: 0.8rem;
        }
        .nav-icons a, .nav-icons button {
            background: rgba(132,16,45,0.2);
            border: 1px solid #84102d;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            font-size: 1rem;
            color: #b5ac8a;
            cursor: pointer;
        }
        body.light .nav-icons a, body.light .nav-icons button {
            background: #f3ede8;
            border-color: #d6c8bd;
            color: #84102d;
        }
        .admin-bar {
            background: #1e1a1c;
            text-align: center;
            padding: 0.3rem;
            font-size: 0.7rem;
            border-bottom: 1px solid #84102d;
        }
        body.light .admin-bar {
            background: #f0e7e0;
            color: #2c241f;
        }
        .admin-bar button {
            background: #84102d;
            border: none;
            border-radius: 30px;
            padding: 0.1rem 0.6rem;
            color: white;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        .hero {
            margin: 1.2rem 0;
            padding: 1.2rem;
            border-radius: 2rem;
            background: rgba(30, 26, 28, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(132,16,45,0.5);
            text-align: center;
        }
        body.light .hero {
            background: #fffef8;
            border-color: #e6d9cf;
        }
        .hero img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #84102d;
            box-shadow: 0 0 18px rgba(132,16,45,0.3);
        }
        .hero h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e6d3, #b5ac8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.4rem;
        }
        .hero .shop-sub {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #b5ac8a;
        }
        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 0.8rem 0;
            font-size: 0.7rem;
        }
        .contact-info span {
            background: rgba(255,255,240,0.05);
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
        }
        .telegram-link a {
            color: #b5ac8a;
            text-decoration: none;
        }
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.8rem;
        }
        .refresh-btn {
            background: rgba(132,16,45,0.2);
            border: 1px solid #84102d;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            color: #b5ac8a;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .card {
            background: rgba(30, 26, 28, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(132,16,45,0.5);
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card-img {
            aspect-ratio: 4/5;
            width: 100%;
            background: #1a1a20;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 0.6rem;
        }
        .card-caption {
            font-size: 0.7rem;
            line-height: 1.4;
            color: #c0c0d0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.3rem;
            font-size: 0.6rem;
            color: #8b8b9b;
        }
        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #84102d;
            border-radius: 30px;
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            cursor: pointer;
            z-index: 12;
        }
        .text-card {
            grid-column: 1/-1;
            background: rgba(30, 26, 28, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            padding: 1rem;
            position: relative;
        }
        /* Fullscreen Gallery - Fast Transition */
        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            flex-direction: column;
        }
        .viewer.active { display: flex; }
        .viewer-top {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 16px;
            display: flex;
            justify-content: flex-end;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
        }
        .viewer-close {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .viewer-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .viewer-slider {
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: transform 0.2s ease-out; /* ✅ FAST TRANSITION */
        }
        .viewer-slide {
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .viewer-slide img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            user-select: none;
        }
        .viewer-caption {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: white;
            text-align: center;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #84102d;
            color: #f5e6d3;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            z-index: 4000;
            opacity: 0;
            transition: 0.2s;
        }
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .login-box {
            background: #1e1a1c;
            border: 1px solid #84102d;
            border-radius: 2rem;
            padding: 1.5rem;
            width: 280px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 8px;
            border-radius: 40px;
            border: 1px solid #84102d;
            background: #2a2528;
            color: white;
        }
        .btn-login, .btn-cancel {
            flex:1;
            padding: 6px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login { background: #84102d; color: white; }
        .btn-cancel { background: #333; color: white; }
        .skeleton-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .skeleton-card {
            background: rgba(30,26,28,0.5);
            border-radius: 1.5rem;
            aspect-ratio: 4/5;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 0.8; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA MYITTA</div>
        <div class="nav-icons">
            <a href="https://t.me/mibamittaa" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</div>
<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" id="adminLogo">
        <h1>မိဘမေတ္တာ<br><span class="shop-sub">အထည်ဆိုင်</span></h1>
        <div class="contact-info">
            <span><i class="fas fa-phone"></i> 09697455880 / 09676827963</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
        <div class="telegram-link"><i class="fab fa-telegram"></i> <a href="https://t.me/mibamyitta1">@mibamyitta1</a></div>
    </div>
    <div class="action-row">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>
    <div id="postGrid" class="product-grid"><div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div></div>
</div>

<div id="imageViewer" class="viewer">
    <div class="viewer-top">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
    </div>
    <div class="viewer-container" id="viewerContainer">
        <div class="viewer-slider" id="viewerSlider"></div>
    </div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h3>🔐 Admin Login</h3>
        <input type="password" id="pinInput" placeholder="စကားဝှက်">
        <div style="display: flex; gap: 8px;">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p id="loginError" style="color:#b5ac8a; font-size:12px;"></p>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API = "/api";
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = !!adminToken;
    let allPosts = [];
    let currentViewerIndex = 0;
    let isZoomed = false;

    function toggleTheme() {
        document.body.classList.toggle('light');
        localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }
    if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');

    function toast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',2000); }
    function openViber() { const phone='09697455880'; if(window.matchMedia('(display-mode: standalone)').matches) { navigator.clipboard.writeText(phone); toast('📞 ဖုန်းနံပါတ်ကူးပြီး'); } else window.location.href='viber://chat?number=%2B959697455880'; }

    function showAdminBar() { document.getElementById('adminBar').innerHTML='<div class="admin-bar">🔐 Admin Mode <button onclick="adminLogout()">ထွက်မည်</button></div>'; }
    function adminLogout() { adminToken=null; isAdmin=false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML=''; loadPosts(); toast('🔓 ထွက်ပြီး'); }
    if(isAdmin) showAdminBar();

    const logo = document.getElementById('adminLogo');
    let loginTimer;
    logo?.addEventListener('touchstart', () => { if(!isAdmin) loginTimer = setTimeout(() => document.getElementById('loginOverlay').style.display='flex', 10000); });
    logo?.addEventListener('touchend', () => clearTimeout(loginTimer));
    logo?.addEventListener('touchmove', () => clearTimeout(loginTimer));

    function closeLogin() { document.getElementById('loginOverlay').style.display='none'; }
    async function adminLogin() {
        const pw=document.getElementById('pinInput').value, err=document.getElementById('loginError');
        if(!pw){ err.innerText='စကားဝှက်ထည့်ပါ'; return; }
        try{
            const res=await fetch(API+'/admin/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
            const data=await res.json();
            if(data.success){ adminToken=data.token; localStorage.setItem('adminToken',adminToken); isAdmin=true; closeLogin(); showAdminBar(); loadPosts(); toast('✅ အက်ဒမင်ဝင်ပြီ'); }
            else{ err.innerText='❌ စကားဝှက်မှား'; }
        }catch(e){ err.innerText='❌ ချိတ်ဆက်မှုအမှား'; }
    }

    window.deletePost=async function(postId){
        if(!confirm("ဖျက်မှာလား?")) return;
        if(!adminToken){ toast('Admin login ဝင်ပါ'); return; }
        try{
            const res=await fetch(`/api/delete?id=${postId}`,{ method:'DELETE', headers:{'Authorization':'Bearer '+adminToken} });
            const data=await res.json();
            if(data.success){ loadPosts(); toast('✅ ဖျက်ပြီး'); } else toast('❌ '+ (data.error||'error'));
        }catch(e){ toast('❌ ချိတ်ဆက်မှုမရ'); }
    };

    function formatDate(ts){
        if(!ts) return '';
        const d=new Date(ts*1000);
        return `${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getFullYear()}`;
    }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    function openViewer(index) {
        if(!allPosts.length) return;
        currentViewerIndex = index;
        const viewer = document.getElementById('imageViewer');
        const slider = document.getElementById('viewerSlider');
        slider.innerHTML = '';
        allPosts.forEach((post, i) => {
            if(post.type !== 'photo') return;
            const slide = document.createElement('div');
            slide.className = 'viewer-slide';
            const img = document.createElement('img');
            img.src = post.image_url;
            const cap = document.createElement('div');
            cap.className = 'viewer-caption';
            cap.innerText = post.caption || '';
            slide.appendChild(img);
            slide.appendChild(cap);
            slider.appendChild(slide);
            setupZoom(img);
        });
        const total = slider.children.length;
        slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
        viewer.style.display = 'flex';
        history.pushState({viewer:true},'');
        
        let startY = 0;
        slider.ontouchstart = (e) => { if(isZoomed) return; if(e.touches.length === 1) startY = e.touches[0].clientY; };
        slider.ontouchend = (e) => {
            if(isZoomed) return;
            if(e.changedTouches.length === 1) {
                const endY = e.changedTouches[0].clientY;
                const diff = startY - endY;
                if(Math.abs(diff) > 40) {
                    if(diff > 0 && currentViewerIndex < total-1) currentViewerIndex++;
                    else if(diff < 0 && currentViewerIndex > 0) currentViewerIndex--;
                    else return;
                    slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
                }
            }
        };
    }
    window.closeViewer = function() { document.getElementById('imageViewer').style.display='none'; };

    function setupZoom(img) {
        let scale = 1;
        let startDist = 0;
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            }
        });
        img.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && startDist > 0) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                let newScale = scale * (dist / startDist);
                newScale = Math.min(Math.max(1, newScale), 4);
                img.style.transform = `scale(${newScale})`;
                isZoomed = newScale > 1.05;
                scale = newScale;
            }
        });
        img.addEventListener('touchend', () => {
            if(scale <= 1.1) {
                scale = 1;
                img.style.transform = 'scale(1)';
                isZoomed = false;
            }
            startDist = 0;
        });
    }

    async function loadPosts(){
        const grid=document.getElementById('postGrid');
        grid.innerHTML='<div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
        try{
            const res=await fetch(API+'/posts');
            const data=await res.json();
            if(!data.success) throw new Error();
            allPosts = data.posts || [];
            if(allPosts.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem;">📭 ပုံမရှိသေး</div>'; return; }
            let html='';
            allPosts.forEach((p, idx) => {
                const delBtn=isAdmin?`<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i> ဖျက်</button>`:'';
                if(p.type==='photo'){
                    html+=`<div class="card" onclick="openViewer(${idx})">
                                ${delBtn}
                                <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div>
                                <div class="card-info">
                                    <div class="card-caption">${escapeHtml(p.caption || '')}</div>
                                    <div class="card-footer">
                                        <span>${formatDate(p.date)}</span>
                                    </div>
                                </div>
                            </div>`;
                } else {
                    html+=`<div class="text-card">${delBtn}<div class="card-caption">📄 ${escapeHtml(p.text||'')}</div><div class="card-footer"><span>${formatDate(p.date)}</span></div></div>`;
                }
            });
            grid.innerHTML=html;
        } catch(e){ grid.innerHTML='<div style="text-align:center;padding:2rem;">❌ ချို့ယွင်းနေ<br><button onclick="loadPosts()">ပြန်ကြိုးစားမည်</button></div>'; }
    }

    window.addEventListener('popstate', () => { if(document.getElementById('imageViewer').style.display === 'flex') closeViewer(); });
    loadPosts();
</script>
</body>
</html>

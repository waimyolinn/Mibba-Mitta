<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIBA MYITTA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#84102d">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #84102d;
            --secondary: #b5ac8a;
            --bg: #0a0a0a;
            --card-bg: #1a1a1a;
            --text: #ffffff;
            --text-muted: #b0b0b0;
        }
        [data-theme="light"] {
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #1a1a1a;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.3s;
            overflow-x: hidden;
        }
        .topbar {
            position: sticky;
            top: 0;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        [data-theme="light"] .topbar { background: rgba(245, 245, 245, 0.8); border-bottom: 1px solid rgba(0,0,0,0.1); }
        .topbar-inner { max-width: 800px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: 1px; color: var(--text); }
        .nav-icons { display: flex; gap: 1.2rem; align-items: center; }
        .nav-icons a, .nav-icons button { color: var(--text); text-decoration: none; background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        
        .container { max-width: 800px; margin: 0 auto; padding: 1rem; }
        .hero { text-align: center; padding: 2rem 1rem; background: linear-gradient(180deg, rgba(132, 16, 45, 0.1) 0%, transparent 100%); border-radius: 2rem; margin-bottom: 1.5rem; }
        .hero img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 1rem; object-fit: cover; }
        .hero h1 { margin: 0; font-size: 2rem; color: var(--text); }
        .shop-sub { font-size: 1.1rem; color: var(--secondary); font-weight: 400; }
        .contact-info { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1rem; color: var(--text-muted); font-size: 0.9rem; }
        .contact-info span { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        
        .action-row { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
        .refresh-btn { background: var(--card-bg); color: var(--text); border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 2rem; font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; }
        
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
        .card { background: var(--card-bg); border-radius: 1.2rem; overflow: hidden; position: relative; transition: transform 0.2s; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); }
        .card:active { transform: scale(0.98); }
        .card-img { width: 100%; aspect-ratio: 4/5; overflow: hidden; background: #222; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-info { padding: 0.8rem; }
        .card-caption { font-size: 0.9rem; line-height: 1.4; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .text-card { background: var(--card-bg); border-radius: 1.2rem; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.05); grid-column: 1 / -1; }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.8); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; z-index: 10; }

        /* Viewer Styles */
        .viewer { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        .viewer-top { position: absolute; top: 0; left: 0; right: 0; padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 2100; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); }
        .viewer-close, .viewer-save { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 10px; }
        .viewer-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .viewer-slider { display: flex; flex-direction: column; height: 100%; width: 100%; transition: transform 0.3s ease-out; }
        .viewer-slide { min-height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .viewer-slide img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.1s ease-out; transform-origin: center; }
        .viewer-caption { position: absolute; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.6); color: white; padding: 1rem; border-radius: 10px; font-size: 0.9rem; backdrop-filter: blur(5px); pointer-events: none; }

        /* Custom Loading Screen */
        #loadingScreen { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loading-logo { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 1.5rem; animation: pulse 1.5s infinite ease-in-out; }
        .loading-text { color: var(--secondary); font-weight: 600; letter-spacing: 2px; font-size: 1.2rem; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 0.9rem; z-index: 4000; display: none; }
        
        .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; width: 100%; }
        .skeleton-card { background: var(--card-bg); aspect-ratio: 4/6; border-radius: 1.2rem; animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

<div id="loadingScreen">
    <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" class="loading-logo">
    <div class="loading-text">MIBA MYITTA</div>
</div>

<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA MYITTA</div>
        <div class="nav-icons">
            <a href="https://t.me/mibamyitta1" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</div>

<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" id="adminLogo">
        <h1>မိဘမေတ္တာ<br><span class="shop-sub">အထည်ဆိုင်</span></h1>
        <div class="contact-info">
            <span><i class="fas fa-phone"></i> 09697455880 / 09676827963</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
    </div>
    <div class="action-row">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>
    <div id="postGrid" class="product-grid"></div>
</div>

<div id="imageViewer" class="viewer">
    <div class="viewer-top">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
        <button class="viewer-save" onclick="saveImage()"><i class="fas fa-download"></i></button>
    </div>
    <div class="viewer-container" id="viewerContainer">
        <div class="viewer-slider" id="viewerSlider"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API = '/api';
    let allPosts = [];
    let currentViewerIndex = 0;
    let isAdmin = false;

    // Theme
    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }
    if(localStorage.getItem('theme') === 'light') document.body.setAttribute('data-theme', 'light');

    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 2000);
    }

    function openViber() { window.location.href = "viber://pa?chatURI=mibamyitta"; }

    // Admin Check
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('admin') === 'true') {
        isAdmin = true;
        document.getElementById('adminBar').innerHTML = '<div style="background:var(--primary);color:white;text-align:center;padding:5px;font-size:0.8rem;">Admin Mode</div>';
    }

    window.deletePost = async (postId) => {
        if(!confirm('ဖျက်မှာ သေချာလား?')) return;
        const token = prompt('Admin Token ရိုက်ထည့်ပါ:');
        if(!token) return;
        try {
            const res = await fetch(`${API}/posts?id=${postId}`, {
                method: 'DELETE',
                headers: { 'Authorization': token }
            });
            const data = await res.json();
            if(data.success) {
                allPosts = allPosts.filter(p => p.id != postId);
                const element = document.getElementById(`post-${postId}`);
                if (element) {
                    element.style.opacity = '0';
                    element.style.transform = 'scale(0.8)';
                    element.style.transition = '0.3s';
                    setTimeout(() => {
                        element.remove();
                        if(allPosts.length === 0) renderPosts();
                    }, 300);
                }
                toast('✅ ဖျက်ပြီး'); 
            } else toast('❌ ' + (data.error || 'error'));
        } catch(e) { toast('❌ ချိတ်ဆက်မှုမရ'); }
    };

    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    // Viewer with Zoom & Swipe
    function openViewer(index) {
        if(!allPosts.length) return;
        currentViewerIndex = index;
        const viewer = document.getElementById('imageViewer');
        const slider = document.getElementById('viewerSlider');
        slider.innerHTML = '';
        
        allPosts.forEach((post, i) => {
            if(post.type !== 'photo') return;
            const slide = document.createElement('div');
            slide.className = 'viewer-slide';
            const img = document.createElement('img');
            img.src = post.image_url;
            img.id = `viewer-img-${i}`;
            
            const cap = document.createElement('div');
            cap.className = 'viewer-caption';
            cap.innerText = post.caption || '';
            
            slide.appendChild(img);
            slide.appendChild(cap);
            slider.appendChild(slide);
            
            setupZoom(img);
        });

        slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
        viewer.style.display = 'flex';
        history.pushState({viewer:true},'');
        
        let startY = 0;
        slider.ontouchstart = (e) => { if(e.touches.length === 1) startY = e.touches[0].clientY; };
        slider.ontouchend = (e) => {
            if(e.changedTouches.length === 1) {
                const endY = e.changedTouches[0].clientY;
                const diff = startY - endY;
                if(Math.abs(diff) > 50) {
                    if(diff > 0 && currentViewerIndex < slider.children.length-1) currentViewerIndex++;
                    else if(diff < 0 && currentViewerIndex > 0) currentViewerIndex--;
                    slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
                }
            }
        };
    }

    function setupZoom(img) {
        let scale = 1;
        let lastScale = 1;
        let startDist = 0;
        
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startDist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
            }
        });

        img.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(
                    e.touches[0].pageX - e.touches[1].pageX,
                    e.touches[0].pageY - e.touches[1].pageY
                );
                scale = Math.min(Math.max(1, lastScale * (dist / startDist)), 4);
                img.style.transform = `scale(${scale})`;
            }
        });

        img.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                lastScale = scale;
                if(scale <= 1.1) {
                    scale = 1;
                    lastScale = 1;
                    img.style.transform = `scale(1)`;
                }
            }
        });
    }

    window.saveImage = async () => {
        const currentImg = document.querySelector(`#viewer-img-${currentViewerIndex}`);
        if(!currentImg) return;
        try {
            const response = await fetch(currentImg.src);
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `miba-myitta-${Date.now()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            toast('✅ ပုံသိမ်းပြီးပါပြီ');
        } catch (e) {
            toast('❌ သိမ်းမရပါ');
        }
    };

    window.closeViewer = function() { 
        document.getElementById('imageViewer').style.display='none'; 
        // Reset all zooms
        document.querySelectorAll('.viewer-slide img').forEach(img => {
            img.style.transform = 'scale(1)';
        });
    };

    function renderPosts() {
        const grid=document.getElementById('postGrid');
        if(allPosts.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem;">📭 ပုံမရှိသေး</div>'; return; }
        let html='';
        allPosts.forEach((p, idx) => {
            const delBtn=isAdmin?`<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i> ဖျက်</button>`:'';
            if(p.type==='photo'){
                html+=`<div class="card" id="post-${p.id}" onclick="openViewer(${idx})">
                            ${delBtn}
                            <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div>
                            <div class="card-info">
                                <div class="card-caption">${escapeHtml(p.caption || '')}</div>
                            </div>
                        </div>`;
            } else {
                html+=`<div class="text-card" id="post-${p.id}">${delBtn}<div class="card-caption">📄 ${escapeHtml(p.text||'')}</div></div>`;
            }
        });
        grid.innerHTML=html;
    }

    async function loadPosts(){
        try{
            const res=await fetch(API+'/posts');
            const data=await res.json();
            if(!data.success) throw new Error('API error');
            allPosts = data.posts || [];
            renderPosts();
            // Hide loading screen after first load
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => document.getElementById('loadingScreen').style.display = 'none', 500);
            }, 1000);
        } catch(e){ 
            console.error('Load error:', e);
            document.getElementById('postGrid').innerHTML='<div style="text-align:center;padding:2rem;">❌ ချို့ယွင်းနေ<br><button onclick="loadPosts()">ပြန်ကြိုးစားမည်</button></div>'; 
            document.getElementById('loadingScreen').style.display = 'none';
        }
    }

    window.addEventListener('popstate', () => { if(document.getElementById('imageViewer').style.display === 'flex') closeViewer(); });
    
    // Register Service Worker for Offline Mode
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').then(reg => {
                console.log('SW registered');
            }).catch(err => console.log('SW error', err));
        });
    }

    loadPosts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MIBA MYITTA</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{
--bg:#09090f;
--card:rgba(20,20,35,.8);
--pink:#ff2ea6;
--purple:#7a5cff;
--cyan:#3cf2ff;
--text:#fff;
--muted:#a9a9c7;
}

body{
font-family:'Inter','Myanmar Text',sans-serif;
background:
radial-gradient(circle at top left,rgba(122,92,255,.25),transparent 30%),
radial-gradient(circle at top right,rgba(255,46,166,.18),transparent 30%),
linear-gradient(180deg,#09090f 0%,#12121d 100%);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
padding-bottom:3rem;
}

.topbar{
position:sticky;
top:0;
z-index:999;
padding:1rem;
backdrop-filter:blur(16px);
background:rgba(10,10,20,.55);
border-bottom:1px solid rgba(255,255,255,.06);
}

.topbar-inner{
max-width:760px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:1.5rem;
font-weight:800;
letter-spacing:1px;
}

.logo span{
background:linear-gradient(90deg,var(--pink),var(--cyan));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-icons{
display:flex;
gap:.8rem;
}

.nav-icons button,
.nav-icons a{
width:42px;
height:42px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.06);
color:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
backdrop-filter:blur(12px);
transition:.25s;
text-decoration:none;
}

.nav-icons button:hover,
.nav-icons a:hover{
transform:translateY(-2px);
box-shadow:0 0 20px rgba(255,46,166,.35);
}

.container{
max-width:760px;
margin:auto;
padding:1rem;
}

.hero{
position:relative;
overflow:hidden;
border-radius:32px;
padding:2rem 1rem;
background:linear-gradient(145deg,rgba(25,25,40,.95),rgba(10,10,20,.9));
border:1px solid rgba(255,255,255,.08);
text-align:center;
box-shadow:
0 0 40px rgba(122,92,255,.14),
0 0 80px rgba(255,46,166,.08);
}

.hero::before{
content:'';
position:absolute;
inset:-40%;
background:radial-gradient(circle,rgba(255,46,166,.15),transparent 40%);
animation:spin 10s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.hero img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(255,255,255,.12);
box-shadow:0 0 25px rgba(255,46,166,.45);
position:relative;
z-index:2;
}

.shop-name{
margin-top:1rem;
font-size:1.8rem;
font-weight:800;
position:relative;
z-index:2;
}

.sub-name{
margin-top:.3rem;
font-size:.85rem;
color:var(--cyan);
letter-spacing:2px;
}

.contact-info{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:.8rem;
margin-top:1rem;
position:relative;
z-index:2;
}

.contact-info span{
padding:.7rem 1rem;
border-radius:999px;
background:rgba(255,255,255,.05);
font-size:.8rem;
color:var(--muted);
border:1px solid rgba(255,255,255,.06);
}

.telegram-badge{
display:inline-flex;
align-items:center;
gap:.5rem;
padding:.75rem 1rem;
margin-top:1rem;
border-radius:999px;
background:linear-gradient(90deg,rgba(255,46,166,.15),rgba(122,92,255,.15));
border:1px solid rgba(255,255,255,.08);
position:relative;
z-index:2;
}

.telegram-badge a{
color:white;
text-decoration:none;
}

.product-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:1rem;
margin-top:1.2rem;
}

.card{
position:relative;
overflow:hidden;
border-radius:28px;
background:linear-gradient(145deg,rgba(25,25,40,.92),rgba(12,12,20,.95));
border:1px solid rgba(255,255,255,.08);
transition:.3s;
cursor:pointer;
}

.card:hover{
transform:translateY(-5px);
box-shadow:
0 0 25px rgba(255,46,166,.18),
0 0 45px rgba(122,92,255,.15);
}

.card-img{
aspect-ratio:4/5;
overflow:hidden;
}

.card-img img{
width:100%;
height:100%;
object-fit:cover;
transition:.35s;
}

.card:hover .card-img img{
transform:scale(1.05);
}

.card-info{
padding:.9rem;
}

.caption-text{
padding:.8rem;
border-radius:18px;
background:rgba(255,255,255,.05);
font-size:.8rem;
line-height:1.5;
}

.card-meta{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:.7rem;
font-size:.72rem;
color:var(--muted);
}

.share-icon{
width:34px;
height:34px;
border-radius:50%;
border:none;
background:rgba(255,255,255,.06);
color:white;
cursor:pointer;
}

.viewer{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
justify-content:center;
align-items:center;
z-index:3000;
}

.viewer img{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.viewer-close{
position:absolute;
top:20px;
right:20px;
width:45px;
height:45px;
border:none;
border-radius:50%;
background:rgba(255,255,255,.1);
color:white;
font-size:1.2rem;
cursor:pointer;
}

.viewer-caption{
position:absolute;
bottom:0;
width:100%;
padding:2rem 1rem 1rem;
background:linear-gradient(transparent,rgba(0,0,0,.85));
text-align:center;
}

.toast{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
padding:.8rem 1.2rem;
border-radius:999px;
background:rgba(15,15,20,.95);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(10px);
opacity:0;
transition:.25s;
}

@media(max-width:600px){

.product-grid{
gap:.8rem;
}

.shop-name{
font-size:1.5rem;
}

.contact-info{
flex-direction:column;
align-items:center;
}

}

</style>
</head>

<body>

<div class="topbar">
<div class="topbar-inner">

<div class="logo">

</div>

<div class="nav-icons">

<span>

<i class="fas fa-map-marker-alt"></i>

</span>

</div>

<div class="telegram-badge">
<i class="fab fa-telegram"></i>

</div>

<div class="product-grid">

<div class="card" onclick="openViewer('https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=1000')">

<div class="card-img">
<img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=1000">
</div>

<div class="card-info">

</button>

</div>

</div>

</div>

<div class="card" onclick="openViewer('https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1000')">

<div class="card-img">
<img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f?q=80&w=1000">

<div class="viewer" id="viewer">

✕
</button>

<img id="viewerImage">

<div class="viewer-caption" id="viewerCaption"></div>

</div>

<div class="toast" id="toast"></div>

<script>

function openViewer(src){
document.getElementById('viewer').style.display='flex';
document.getElementById('viewerImage').src=src;
}

function closeViewer(){
document.getElementById('viewer').style.display='none';
}

function toggleDarkMode(){
document.body.classList.toggle('dark');
showToast('Dark mode changed');
}

function showToast(text){
const toast=document.getElementById('toast');
toast.innerText=text;
toast.style.opacity='1';

setTimeout(()=>{
toast.style.opacity='0';
},2000);
}

</script>

</body>
</html>

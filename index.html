<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MIBA MITTA – အထည်ဆိုင်</title>
    <meta name="description" content="MIBA MITTA - အရည်အသွေးမြင့် အထည်များ">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#fff4ef">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Myanmar Text', system-ui, sans-serif;
            background: #fff8f5;
            color: #1f1f1f;
            padding-bottom: 2rem;
        }

        /* Dark mode */
        body.dark {
            background: #0f0f0f;
            color: #e0e0e0;
        }
        body.dark .card,
        body.dark .hero,
        body.dark .topbar,
        body.dark .login-box {
            background: #1c1c1c;
            border-color: #2e2e2e;
        }
        body.dark .price-badge {
            background: #2e2520;
            color: #e6896e;
        }
        body.dark .contact-info {
            color: #bdbdbd;
        }

        /* Topbar */
        .topbar {
            background: #ffffff;
            padding: 0.8rem 1rem;
            border-bottom: 1px solid #f0e0d6;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
            background: rgba(255, 255, 255, 0.94);
        }
        body.dark .topbar {
            background: rgba(28, 28, 28, 0.94);
            border-bottom: 1px solid #2a2a2a;
        }
        .topbar-inner {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .logo span {
            color: #c4532f;
        }
        .nav-icons {
            display: flex;
            gap: 1rem;
        }
        .nav-icons a, .nav-icons button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #3b2c26;
            transition: 0.2s;
        }
        body.dark .nav-icons a, body.dark .nav-icons button {
            color: #e0e0e0;
        }
        .nav-icons button:hover, .nav-icons a:hover {
            color: #c4532f;
        }

        .admin-bar {
            background: #2c241f;
            color: #f0dbd1;
            font-size: 0.7rem;
            text-align: center;
            padding: 0.35rem;
            font-weight: 500;
        }
        .admin-bar button {
            background: #c4532f;
            border: none;
            color: white;
            border-radius: 20px;
            padding: 2px 12px;
            margin-left: 8px;
            cursor: pointer;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Hero / brand + contact */
        .hero {
            background: #ffffff;
            margin: 1rem 0 1.2rem;
            padding: 1.2rem 1rem;
            border-radius: 28px;
            border: 1px solid #f7e4da;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02);
        }
        body.dark .hero {
            background: #1a1a1a;
            border-color: #2e2e2e;
        }
        .hero img {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #c4532f;
            margin-bottom: 0.5rem;
        }
        .hero h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .hero h1 span {
            color: #c4532f;
        }
        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            font-size: 0.75rem;
            margin: 0.8rem 0 0.4rem;
            color: #5a4a42;
        }
        .contact-info i {
            color: #c4532f;
            width: 1.2rem;
        }
        .telegram-badge {
            background: #e9e0da;
            display: inline-block;
            padding: 0.2rem 0.9rem;
            border-radius: 60px;
            font-size: 0.7rem;
        }
        body.dark .telegram-badge {
            background: #2a2a2a;
        }

        /* refresh */
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }
        .refresh-btn {
            background: transparent;
            border: 1px solid #e6d5cc;
            border-radius: 40px;
            padding: 0.3rem 0.9rem;
            font-size: 0.7rem;
            cursor: pointer;
            color: inherit;
        }

        /* product grid */
        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .card {
            background: white;
            border-radius: 26px;
            overflow: hidden;
            border: 1px solid #f5e4db;
            transition: 0.2s ease;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 24px -12px rgba(0, 0, 0, 0.12);
        }
        .card-img {
            aspect-ratio: 4 / 5;
            width: 100%;
            background: #faf1ec;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .card-info {
            padding: 0.7rem;
        }
        .product-title {
            font-size: 0.8rem;
            font-weight: 600;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .price-badge {
            background: #fdece5;
            color: #c4532f;
            font-weight: 700;
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            display: inline-block;
        }
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.6rem;
        }
        .share-icon {
            background: none;
            border: none;
            font-size: 0.9rem;
            cursor: pointer;
            color: #b28b78;
        }

        .text-card {
            grid-column: 1 / -1;
            background: white;
            border-radius: 26px;
            padding: 1rem;
            border: 1px solid #f5e4db;
            position: relative;
        }

        /* delete button */
        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(2px);
            border: none;
            border-radius: 40px;
            color: white;
            font-size: 0.6rem;
            padding: 3px 10px;
            font-weight: 500;
            cursor: pointer;
            z-index: 22;
        }

        /* skeleton */
        .skeleton-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .skeleton-card {
            background: #ebdad2;
            border-radius: 26px;
            aspect-ratio: 4/5;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        /* image viewer */
        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .viewer.active { display: flex; }
        .viewer-content {
            position: relative;
            max-width: 100%;
            max-height: 100%;
        }
        .viewer-content img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            transform-origin: center;
            transition: transform 0.1s ease-out;
        }
        .viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 1.5rem;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            cursor: pointer;
        }
        .viewer-caption {
            position: absolute;
            bottom: 0;
            background: linear-gradient(transparent, black);
            width: 100%;
            text-align: center;
            padding: 2rem 1rem 1rem;
            color: white;
            font-size: 0.85rem;
        }

        /* login modal */
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .login-box {
            background: white;
            border-radius: 32px;
            padding: 1.5rem;
            width: 280px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 8px;
            border-radius: 40px;
            border: 1px solid #e0cfc6;
            margin: 12px 0;
        }
        .btn-login, .btn-cancel {
            flex: 1;
            padding: 8px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login { background: #c4532f; color: white; }
        .btn-cancel { background: #e2d9d4; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f1f1f;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            z-index: 4000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA<span>MITTA</span></div>
        <div class="nav-icons">
            <a href="https://t.me/mibamittaa" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</div>
<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" alt="logo" id="adminLogo">
        <h1>MIBA <span>MITTA</span></h1>
        <div class="contact-info">
            <span><i class="fas fa-phone"></i> 09697455880 / 09676827963</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
        <div class="telegram-badge">
            <i class="fab fa-telegram"></i> <a href="https://t.me/mibamyitta1" target="_blank" style="text-decoration: none;">@mibamyitta1</a>
        </div>
    </div>
    <div class="action-row">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>
    <div id="postGrid" class="product-grid">
        <div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>
    </div>
</div>

<!-- viewer modal -->
<div id="imageViewer" class="viewer">
    <div class="viewer-content">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
        <img id="viewerImage" src="">
        <div id="viewerCaption" class="viewer-caption"></div>
    </div>
</div>

<!-- admin login -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h3>🔐 Admin Login</h3>
        <input type="password" id="pinInput" placeholder="စကားဝှက်">
        <div style="display: flex; gap: 8px;">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p id="loginError" style="color:#c4532f; font-size:12px;"></p>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API = "/api";
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = !!adminToken;

    function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.style.opacity = '1';
        setTimeout(() => el.style.opacity = '0', 2200);
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark'));
    }
    if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark');

    function openViber() {
        const phone = '09697455880';
        if (window.matchMedia('(display-mode: standalone)').matches) {
            navigator.clipboard.writeText(phone);
            toast('📞 ဖုန်းနံပါတ် ကူးပြီးပါပြီ');
        } else {
            window.location.href = 'viber://chat?number=%2B959697455880';
        }
    }

    function showAdminBar() {
        document.getElementById('adminBar').innerHTML = '<div class="admin-bar">🔐 Admin Mode <button onclick="adminLogout()">ထွက်မည်</button></div>';
    }
    function adminLogout() {
        adminToken = null; isAdmin = false;
        localStorage.removeItem('adminToken');
        document.getElementById('adminBar').innerHTML = '';
        loadPosts();
        toast('🔓 Admin mode မှ ထွက်ပြီးပါပြီ');
    }
    if (isAdmin) showAdminBar();

    const logo = document.getElementById('adminLogo');
    let loginTimer;
    logo.addEventListener('touchstart', () => { if (!isAdmin) loginTimer = setTimeout(() => { document.getElementById('loginOverlay').style.display = 'flex'; }, 1200); });
    logo.addEventListener('touchend', () => clearTimeout(loginTimer));
    logo.addEventListener('touchmove', () => clearTimeout(loginTimer));

    function closeLogin() { document.getElementById('loginOverlay').style.display = 'none'; }
    async function adminLogin() {
        const pw = document.getElementById('pinInput').value;
        const err = document.getElementById('loginError');
        if (!pw) { err.innerText = 'စကားဝှက်ထည့်ပါ'; return; }
        try {
            const res = await fetch(API + '/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
            const data = await res.json();
            if (data.success) {
                adminToken = data.token;
                localStorage.setItem('adminToken', adminToken);
                isAdmin = true;
                closeLogin();
                showAdminBar();
                loadPosts();
                toast('✅ အက်ဒမင်အကောင့် ဝင်ပြီးပါပြီ');
            } else {
                err.innerText = '❌ စကားဝှက်မှားနေသည်';
            }
        } catch(e) { err.innerText = '❌ ချိတ်ဆက်မှု မအောင်မြင်ပါ'; }
    }

    window.deletePost = async function(postId) {
        if (!confirm("ဖျက်မှာလား?")) return;
        if (!adminToken) { toast('Admin login ဝင်ရန်လိုအပ်ပါသည်'); return; }
        try {
            const res = await fetch(`/api/delete?id=${postId}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + adminToken } });
            const data = await res.json();
            if (data.success) { loadPosts(); toast('✅ ဖျက်ခြင်းအောင်မြင်ပါပြီ'); }
            else { toast('❌ ဖျက်မရပါ: ' + (data.error || '')); }
        } catch(e) { toast('❌ ချိတ်ဆက်မှု ချော်ယွင်းနေပါသည်'); }
    };

    function sharePost(text) {
        if (navigator.share) navigator.share({ title: 'MIBA MITTA', text: text });
        else if (navigator.clipboard) { navigator.clipboard.writeText(text); toast('📋 စာသားကူးပြီးပါပြီ'); }
    }

    function formatDate(ts) {
        if (!ts) return '';
        const d = new Date(ts*1000);
        return `${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getFullYear()}`;
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    async function loadPosts() {
        const grid = document.getElementById('postGrid');
        grid.innerHTML = '<div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
        try {
            const res = await fetch(API + '/posts');
            const data = await res.json();
            if (!data.success) throw new Error('API error');
            const posts = data.posts || [];
            if (posts.length === 0) { grid.innerHTML = '<div style="text-align:center; padding:2rem;">📭 လက်ရှိပုံများ မရှိသေးပါ</div>'; return; }
            let html = '';
            posts.forEach(p => {
                const delBtn = isAdmin ? `<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i> ဖျက်</button>` : '';
                if (p.type === 'photo') {
                    html += `<div class="card" onclick="openViewer('${p.image_url}', '${escapeHtml(p.caption || '')}')">
                                ${delBtn}
                                <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div>
                                <div class="card-info">
                                    <div class="product-title">${escapeHtml(p.caption || 'အထည်')}</div>
                                    <div class="card-meta">
                                        <span class="price-badge"><i class="fas fa-tag"></i> အထည်</span>
                                        <button class="share-icon" onclick="event.stopPropagation(); sharePost('${escapeHtml(p.caption || '')}')"><i class="fas fa-share-alt"></i></button>
                                    </div>
                                </div>
                            </div>`;
                } else {
                    html += `<div class="text-card">${delBtn}<p>${escapeHtml(p.text || '')}</p><div class="card-meta"><span class="price-badge">${formatDate(p.date)}</span><button class="share-icon" onclick="event.stopPropagation(); sharePost('${escapeHtml(p.text || '')}')"><i class="fas fa-share-alt"></i></button></div></div>`;
                }
            });
            grid.innerHTML = html;
        } catch(e) { grid.innerHTML = '<div style="text-align:center; padding:2rem;">❌ ချို့ယွင်းနေပါသည်<br><button onclick="loadPosts()" style="margin-top:12px;">ပြန်ကြိုးစားမည်</button></div>'; }
    }

    // Image Viewer + Pinch Zoom
    let currentScale = 1, startDist = 0, startScale = 1;
    function openViewer(src, cap) {
        const modal = document.getElementById('imageViewer');
        const img = document.getElementById('viewerImage');
        img.src = src;
        img.style.transform = 'scale(1)';
        currentScale = 1;
        document.getElementById('viewerCaption').innerText = cap;
        modal.style.display = 'flex';
        history.pushState({ viewer: true }, '');
    }
    window.closeViewer = function() {
        document.getElementById('imageViewer').style.display = 'none';
    };
    const viewerImg = document.getElementById('viewerImage');
    viewerImg.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            startDist = Math.hypot(dx, dy);
            startScale = currentScale;
        }
    });
    viewerImg.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && startDist > 0) {
            e.preventDefault();
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const newDist = Math.hypot(dx, dy);
            let scale = startScale * (newDist / startDist);
            scale = Math.min(Math.max(scale, 1), 4);
            viewerImg.style.transform = `scale(${scale})`;
            currentScale = scale;
        }
    });
    viewerImg.addEventListener('touchend', () => { startDist = 0; });
    window.addEventListener('popstate', () => { if (document.getElementById('imageViewer').style.display === 'flex') closeViewer(); });

    loadPosts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>မိဘမေတ္တာ - အထည်ဆိုင်</title>
    
    <meta name="google-site-verification" content="NLqyHByZ-OnqMIKZDidDeUzfNeXN8-SfJElHoPqbrY8" />
    
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="မိဘမေတ္တာ">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <meta name="theme-color" content="#8b5a2b">
    <meta name="description" content="မိဘမေတ္တာ အထည်ဆိုင်">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #8b5a2b;
            --bg: #fdf8f0;
            --bg-secondary: #f5e8d8;
            --card: #ffffff;
            --text: #3d2b1a;
            --text-light: #7a5a4e;
            --text-muted: #b0a090;
            --border: #f0e0d0;
            --shadow: 0 2px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
            --radius: 20px;
            --transition: 0.25s ease;
        }
        
        [data-dark="true"] {
            --primary: #c4956a;
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --card: #21262d;
            --text: #e6edf3;
            --text-light: #c9d1d9;
            --text-muted: #8b949e;
            --border: #30363d;
            --shadow: 0 2px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(160deg, var(--bg), var(--bg-secondary), var(--bg));
            min-height: 100vh; min-height: 100dvh;
            padding: 16px; padding-bottom: 80px;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }
        .container { max-width: 560px; margin: 0 auto; }
        
        /* Dark Mode Toggle */
        .dark-toggle {
            position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px;
            border-radius: 50%; background: var(--card); box-shadow: var(--shadow-lg);
            border: 2px solid var(--border); cursor: pointer; z-index: 100;
            font-size: 22px; display: flex; align-items: center; justify-content: center;
        }
        
        /* Header */
        .header-card {
            background: var(--card);
            border-radius: 24px; padding: 24px 20px 20px; margin-bottom: 16px;
            box-shadow: var(--shadow-lg); text-align: center; position: relative; overflow: hidden;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .header-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #8b5a2b, #c4956a, #8b5a2b);
        }
        .shop-logo { width: 64px; height: 64px; border-radius: 16px; object-fit: cover; margin-bottom: 12px; }
        .shop-name { font-size: 26px; font-weight: 800; color: var(--primary); }
        .welcome-badge {
            display: inline-block; background: #fef5e8; color: #b8863f;
            font-size: 13px; font-weight: 600; padding: 6px 20px; border-radius: 50px; margin: 10px 0;
        }
        [data-dark="true"] .welcome-badge { background: #1c2541; color: #c4956a; }
        .contact-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
        .contact-item { font-size: 12px; color: var(--text-light); background: #fef9f3; padding: 6px 14px; border-radius: 50px; }
        [data-dark="true"] .contact-item { background: #1c2541; }
        
        /* Buttons */
        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 16px; border-radius: 16px; font-weight: 600; font-size: 14px;
            cursor: pointer; border: none; text-decoration: none;
        }
        .btn:active { transform: scale(0.96); }
        .btn-telegram { background: #0088cc; color: #fff; }
        .btn-viber { background: #7360f2; color: #fff; }
        .btn-install {
            background: linear-gradient(135deg, #27ae60, #2ecc71); color: #fff;
            grid-column: 1 / -1; display: none; font-size: 15px;
        }
        .installed-badge { text-align: center; background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 16px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; }
        
        /* QR */
        .install-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 16px; transition: background 0.3s; }
        .install-section img { width: 72px; height: 72px; border-radius: 12px; }
        
        /* Admin */
        .admin-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 16px; }
        .admin-badge { background: #1a1a2e; color: #fff; padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 700; }
        .admin-logout { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: 50px; font-size: 11px; cursor: pointer; }
        
        /* Posts */
        .refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .refresh-btn { background: var(--card); border: 1px solid var(--border); color: var(--primary); padding: 8px 16px; border-radius: 50px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .post-card { background: var(--card); border-radius: var(--radius); margin-bottom: 16px; overflow: hidden; box-shadow: var(--shadow); position: relative; transition: background 0.3s; }
        .post-image-wrap { position: relative; cursor: pointer; overflow: hidden; background: #f5f0ea; }
        .post-image-wrap img { width: 100%; display: block; }
        .post-image-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.8)); color: #fff; padding: 32px 16px 14px; font-size: 14px; }
        .post-text-content { padding: 20px; font-size: 15px; line-height: 1.7; }
        .post-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--border); }
        .post-footer-left { display: flex; align-items: center; gap: 10px; }
        .post-date { font-size: 11px; color: var(--text-muted); }
        .post-type-badge { font-size: 10px; background: #fef5e8; color: var(--primary); padding: 3px 10px; border-radius: 50px; font-weight: 600; }
        [data-dark="true"] .post-type-badge { background: #1c2541; }
        .share-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; }
        .delete-btn { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50px; padding: 6px 14px; font-size: 12px; font-weight: 600; cursor: pointer; z-index: 10; }
        
        /* Skeleton */
        .skeleton-card { background: var(--card); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow); }
        .skeleton { background: linear-gradient(90deg, #f0e0d0, #f5ece0, #f0e0d0); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 12px; }
        [data-dark="true"] .skeleton { background: linear-gradient(90deg, #21262d, #30363d, #21262d); background-size: 200% 100%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .skeleton-img { width: 100%; height: 250px; }
        .skeleton-footer { padding: 12px 16px; display: flex; justify-content: space-between; }
        .skeleton-badge { width: 50px; height: 20px; }
        .skeleton-date { width: 80px; height: 14px; }
        
        /* Status */
        .status-card { text-align: center; padding: 48px 24px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); color: var(--text-muted); }
        .retry-btn { background: var(--primary); color: #fff; border: none; padding: 10px 24px; border-radius: 50px; font-weight: 600; cursor: pointer; margin-top: 12px; }
        
        /* Viewer */
        .viewer-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.96); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; }
        .viewer-overlay.active { display: flex; }
        .viewer-close { position: absolute; top: 16px; right: 20px; color: #fff; font-size: 32px; width: 44px; height: 44px; background: rgba(255,255,255,0.15); border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .viewer-image-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
        .viewer-image-wrap img { max-width: 90%; max-height: 80vh; object-fit: contain; border-radius: 8px; }
        .viewer-caption { color: #fff; text-align: center; padding: 8px 24px 32px; font-size: 14px; }
        
        /* Login */
        .login-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 3000; align-items: center; justify-content: center; }
        .login-overlay.active { display: flex; }
        .login-box { background: var(--card); border-radius: 24px; padding: 32px 24px; width: 90%; max-width: 360px; text-align: center; }
        .login-box h3 { color: var(--primary); }
        .login-box input { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 14px; font-size: 16px; text-align: center; outline: none; background: var(--bg); color: var(--text); margin: 16px 0; }
        .login-box .btn-row { display: flex; gap: 10px; }
        .btn-login { flex: 1; background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 50px; font-weight: 600; cursor: pointer; }
        .btn-cancel { flex: 1; background: var(--border); color: var(--text); border: none; padding: 12px; border-radius: 50px; font-weight: 600; cursor: pointer; }
        .login-error { color: #e74c3c; font-size: 12px; margin-top: 10px; display: none; }
        
        /* Toast */
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 50px; font-size: 13px; z-index: 4000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .pull-indicator { text-align: center; padding: 12px; color: var(--text-muted); font-size: 13px; display: none; }
        .pull-indicator.show { display: block; }
        .new-post-badge { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: #e74c3c; color: #fff; padding: 8px 20px; border-radius: 50px; font-size: 13px; font-weight: 700; cursor: pointer; z-index: 500; display: none; box-shadow: 0 4px 16px rgba(231,76,60,0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="new-post-badge" id="newPostBadge" onclick="loadPosts()">🆕 ပို့စ်သစ်ရှိသည်</div>
    <div class="pull-indicator" id="pullIndicator">⬇️ ဆွဲချပြီး ပြန်စတင်ပါ</div>

    <div class="header-card">
        <img class="shop-logo" src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" alt="Logo">
        <div class="shop-name">မိဘမေတ္တာ <small style="font-weight:500;color:var(--primary);display:block;">အထည်ဆိုင်</small></div>
        <div class="welcome-badge">🙏 မင်္ဂလာပါ ကြိုဆိုပါတယ် 🙏</div>
        <div class="contact-row">
            <span class="contact-item"><i class="fas fa-phone"></i> 09697455880</span>
            <span class="contact-item"><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
    </div>

    <div class="action-buttons">
        <a href="#" class="btn btn-telegram" onclick="openTelegram(event)"><i class="fab fa-telegram-plane"></i> Telegram</a>
        <a href="#" class="btn btn-viber" onclick="openViber(event)"><i class="fab fa-viber"></i> Viber</a>
        <a href="#" class="btn btn-install" id="installBtn" onclick="installApp()"><i class="fas fa-download"></i> အက်ပ် ထည့်သွင်းရန်</a>
    </div>
    <div class="installed-badge" id="installedBadge">✅ အက်ပ် ထည့်သွင်းပြီးပါပြီ</div>

    <div class="install-section">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://mibbamitta.pages.dev" alt="QR">
        <div class="info">
            <p style="font-size:13px;color:var(--text-light);">📲 အက်ပ်ထည့်ရန် QR Scan လုပ်ပါ</p>
            <small style="color:var(--text-muted);">Chrome Browser ဖြင့် Scan လုပ်ပါ</small>
        </div>
    </div>

    <div id="adminBar"></div>

    <div class="refresh-bar">
        <span class="post-count" id="postCount" style="color:var(--text-muted);font-size:12px;"></span>
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>

    <div id="postGrid"></div>
</div>

<button class="dark-toggle" onclick="toggleDarkMode()"><span id="darkIcon">🌙</span></button>

<div class="viewer-overlay" id="imageViewer">
    <button class="viewer-close" onclick="closeViewer()">&times;</button>
    <div class="viewer-image-wrap"><img id="viewerImage" src="" alt="ပုံ"></div>
    <div class="viewer-caption" id="viewerCaption"></div>
</div>

<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <div style="font-size:40px;">🔐</div>
        <h3>Admin Login</h3>
        <input type="password" id="loginPassword" placeholder="••••••••" onkeypress="if(event.key==='Enter')adminLogin()">
        <div class="btn-row">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const WORKER_URL = "https://misty-scene-5b01.waimyolinnaoehtein.workers.dev";
    let lastPostId = 0;
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = adminToken ? true : false;
    let deferredPrompt;
    let darkMode = localStorage.getItem('darkMode') === 'true';
    
    // ==================== Service Worker ====================
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    
    // ==================== Dark Mode ====================
    function applyDarkMode() {
        if (darkMode) {
            document.documentElement.setAttribute('data-dark', 'true');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1117');
        } else {
            document.documentElement.removeAttribute('data-dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#8b5a2b');
        }
        document.getElementById('darkIcon').textContent = darkMode ? '☀️' : '🌙';
    }
    function toggleDarkMode() { darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); applyDarkMode(); }
    applyDarkMode();
    
    // ==================== Toast ====================
    function showToast(msg) {
        var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2500);
    }
    
    // ==================== PWA Install ====================
    var installBtn = document.getElementById('installBtn');
    var installedBadge = document.getElementById('installedBadge');
    if (window.matchMedia('(display-mode: standalone)').matches) installedBadge.style.display = 'block';
    window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'flex'; });
    function installApp() {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function(r) {
            if (r.outcome === 'accepted') { installBtn.style.display = 'none'; installedBadge.style.display = 'block'; }
            deferredPrompt = null;
        });
    }
    window.addEventListener('appinstalled', function() { installBtn.style.display = 'none'; installedBadge.style.display = 'block'; });
    
    // ==================== Telegram (Service Worker Method) ====================
    function openTelegram(e) {
        e.preventDefault();
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'OPEN_URL', url: 'https://t.me/mibamittaa' });
        } else {
            window.open('https://t.me/mibamittaa', '_blank');
        }
    }
    
    // ==================== Viber (Service Worker Method) ====================
    function openViber(e) {
        e.preventDefault();
        var phone = '09697455880';
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'OPEN_URL', url: 'viber://chat?number=%2B959697455880' });
        } else {
            window.location.href = 'viber://chat?number=%2B959697455880';
        }
        setTimeout(function() {
            if (!document.hidden && navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(phone).then(function() {
                    alert("📞 ဖုန်းနံပါတ် " + phone + " ကူးယူပြီးပါပြီ။");
                });
            }
        }, 2000);
    }
    
    // ==================== Admin ====================
    if (isAdmin) showAdminBar();
    var logo = document.querySelector('.shop-logo');
    var longPressTimer;
    logo.addEventListener('touchstart', function() { if(!isAdmin) longPressTimer = setTimeout(showLogin, 3000); });
    logo.addEventListener('touchend', function() { clearTimeout(longPressTimer); });
    logo.addEventListener('touchmove', function() { clearTimeout(longPressTimer); });
    logo.addEventListener('mousedown', function() { if(!isAdmin) longPressTimer = setTimeout(showLogin, 3000); });
    logo.addEventListener('mouseup', function() { clearTimeout(longPressTimer); });
    logo.addEventListener('mouseleave', function() { clearTimeout(longPressTimer); });
    
    function showLogin() {
        document.getElementById('loginOverlay').classList.add('active');
        document.getElementById('loginPassword').focus();
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginPassword').value = '';
    }
    function closeLogin() { document.getElementById('loginOverlay').classList.remove('active'); }
    
    async function adminLogin() {
        var pw = document.getElementById('loginPassword').value;
        var err = document.getElementById('loginError');
        if (!pw) { err.style.display = 'block'; err.textContent = 'Password ထည့်ပါ'; return; }
        try {
            var res = await fetch(WORKER_URL + '/admin/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw })
            });
            var data = await res.json();
            if (data.success) {
                adminToken = data.token; localStorage.setItem('adminToken', adminToken); isAdmin = true;
                closeLogin(); showAdminBar(); loadPosts();
            } else { err.style.display = 'block'; err.textContent = '❌ Password မှားနေပါသည်'; }
        } catch(e) { err.style.display = 'block'; err.textContent = '❌ ချိတ်ဆက်မှု မအောင်မြင်ပါ'; }
    }
    
    function showAdminBar() {
        document.getElementById('adminBar').innerHTML = '<div class="admin-bar"><div class="admin-badge">🔐 Admin Mode</div><button class="admin-logout" onclick="adminLogout()">ထွက်မည်</button></div>';
    }
    function adminLogout() { adminToken = null; isAdmin = false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML = ''; loadPosts(); }
    
    // ==================== Delete ====================
    async function deletePost(postId) {
        if (!confirm("ဖျက်မှာလား?")) return;
        try {
            var res = await fetch(WORKER_URL + '/post/' + postId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + adminToken } });
            var data = await res.json();
            if (data.success) { loadPosts(); showToast('✅ ဖျက်ပြီးပါပြီ'); }
            else if (data.error && data.error.includes('ခွင့်မပြု')) { alert("သက်တမ်းကုန်ပါပြီ။"); adminLogout(); }
        } catch(e) { alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ"); }
    }
    
    // ==================== Share ====================
    function sharePost(post) {
        var text = post.type === 'photo' ? (post.caption || 'ပုံ') : (post.text || 'စာသား');
        if (navigator.share) navigator.share({ title: 'မိဘမေတ္တာ', text: text.substring(0, 100) });
        else { navigator.clipboard && navigator.clipboard.writeText(text); showToast('📋 ကူးယူပြီးပါပြီ'); }
    }
    
    // ==================== Format ====================
    function formatDate(ts) {
        if (!ts) return "";
        var d = new Date(ts * 1000);
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return d.getDate() + ' ' + months[d.getMonth()] + ' \'' + d.getFullYear().toString().slice(2) + ' · ' + d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    function escapeHtml(t) {
        if (!t) return "";
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    
    // ==================== Load Posts ====================
    async function loadPosts(showSkeleton) {
        if (showSkeleton !== false) showSkeleton = true;
        var grid = document.getElementById('postGrid');
        if (showSkeleton) {
            grid.innerHTML = '';
            for (var i = 0; i < 3; i++) grid.innerHTML += '<div class="skeleton-card"><div class="skeleton skeleton-img"></div><div class="skeleton-footer"><div class="skeleton skeleton-badge"></div><div class="skeleton skeleton-date"></div></div></div>';
        }
        
        try {
            var res = await fetch(WORKER_URL + '/posts');
            var data = await res.json();
            if (!data.success) throw new Error("API Error");
            
            var posts = data.posts || [];
            document.getElementById('postCount').textContent = posts.length ? 'ပို့စ် ' + posts.length + ' ခု' : '';
            if (posts.length > 0 && posts[0].id > lastPostId && lastPostId > 0) document.getElementById('newPostBadge').style.display = 'block';
            if (posts.length > 0) lastPostId = posts[0].id;
            if (!posts.length) { grid.innerHTML = '<div class="status-card"><p>📭 ပို့စ်မရှိသေးပါ</p></div>'; return; }
            
            var html = '';
            posts.forEach(function(post) {
                var dateStr = formatDate(post.date);
                var deleteBtn = isAdmin ? '<button class="delete-btn" onclick="event.stopPropagation();deletePost(' + post.id + ')"><i class="fas fa-trash"></i> ဖျက်ရန်</button>' : '';
                var caption = post.caption || '';
                var safeCaption = escapeHtml(caption);
                
                if (post.type === 'photo') {
                    html += '<div class="post-card">' + deleteBtn + '<div class="post-image-wrap" onclick="openViewer(\'' + post.image_url + '\',\'' + safeCaption + '\')"><img src="' + post.image_url + '" alt="ပုံ" loading="lazy">' + (caption ? '<div class="post-image-caption">' + safeCaption + '</div>' : '') + '</div><div class="post-footer"><div class="post-footer-left"><span class="post-type-badge">📷 ပုံ</span><span class="post-date"><i class="far fa-clock"></i> ' + dateStr + '</span></div><button class="share-btn" onclick="event.stopPropagation();sharePost({type:\'photo\',caption:\'' + safeCaption + '\'})"><i class="fas fa-share-alt"></i></button></div></div>';
                } else {
                    html += '<div class="post-card">' + deleteBtn + '<div class="post-text-content">' + escapeHtml(post.text || '') + '</div><div class="post-footer"><div class="post-footer-left"><span class="post-type-badge">📝 စာသား</span><span class="post-date"><i class="far fa-clock"></i> ' + dateStr + '</span></div><button class="share-btn" onclick="event.stopPropagation();sharePost({type:\'text\',text:\'' + escapeHtml(post.text || '') + '\'})"><i class="fas fa-share-alt"></i></button></div></div>';
                }
            });
            grid.innerHTML = html;
        } catch(e) {
            grid.innerHTML = '<div class="status-card"><p>❌ ချို့ယွင်းနေပါသည်</p><small>အင်တာနက်စစ်ဆေးပါ</small><br><button class="retry-btn" onclick="loadPosts()"><i class="fas fa-redo"></i> ပြန်ကြိုးစားမည်</button></div>';
        }
    }
    
    // ==================== Image Viewer ====================
    function openViewer(src, caption) {
        document.getElementById('imageViewer').classList.add('active');
        document.getElementById('viewerImage').src = src;
        document.getElementById('viewerCaption').textContent = caption || '';
        document.body.style.overflow = 'hidden';
    }
    function closeViewer() { document.getElementById('imageViewer').classList.remove('active'); document.body.style.overflow = ''; }
    
    // ==================== Pull to Refresh ====================
    var pullStart = 0;
    document.addEventListener('touchstart', function(e) { pullStart = e.touches[0].clientY; }, { passive: true });
    document.addEventListener('touchmove', function(e) {
        if (e.touches[0].clientY - pullStart > 60 && window.scrollY === 0) document.getElementById('pullIndicator').classList.add('show');
    }, { passive: true });
    document.addEventListener('touchend', function() {
        if (document.getElementById('pullIndicator').classList.contains('show')) {
            document.getElementById('pullIndicator').classList.remove('show');
            document.getElementById('newPostBadge').style.display = 'none';
            loadPosts();
        }
    });
    
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeViewer(); });
    
    // ==================== Init ====================
    loadPosts();
</script>

</body>
</html>

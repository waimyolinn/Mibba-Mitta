<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>မိဘမေတ္တာ - အထည်ဆိုင်</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <meta name="theme-color" content="#0d1117">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --text: #1a1a1a;
            --sub: #666;
            --muted: #999;
            --border: #eee;
            --accent: #8b5a2b;
            --radius: 14px;
        }
        [data-dark="true"] {
            --bg: #0d1117;
            --card: #161b22;
            --text: #e6edf3;
            --sub: #8b949e;
            --muted: #6e7681;
            --border: #21262d;
            --accent: #d4a574;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Myanmar Text', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }
        .topbar {
            position: sticky;
            top: 0;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }
        .topbar-brand { font-size: 16px; font-weight: 700; }
        .topbar-brand span { color: var(--accent); }
        .topbar-links { display: flex; gap: 8px; }
        .topbar-links a, .topbar-links button {
            font-size: 11px;
            padding: 6px 12px;
            border-radius: 50px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-tg { background: #0088cc; color: #fff; }
        .btn-vb { background: #7360f2; color: #fff; }
        .btn-dark { background: var(--border); color: var(--sub); width: 32px; padding: 6px; }
        .admin-bar {
            background: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .admin-bar button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 2px 10px;
            border-radius: 50px;
            margin-left: 8px;
            cursor: pointer;
        }
        .main-wrap { max-width: 600px; margin: 0 auto; padding: 12px; }
        .hero {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .hero img { width: 80px; height: 80px; border-radius: 20px; margin-bottom: 8px; }
        .hero h1 { font-size: 20px; }
        .hero h1 small { font-size: 13px; color: var(--sub); display: block; }
        .refresh-wrap { text-align: center; margin-bottom: 16px; }
        .refresh-wrap button {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            cursor: pointer;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            cursor: pointer;
            position: relative;
        }
        .card-img { aspect-ratio: 3/4; overflow: hidden; background: #f0f0f0; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-body { padding: 8px; }
        .card-caption { font-size: 11px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; justify-content: space-between; margin-top: 6px; font-size: 9px; color: var(--muted); }
        .card-share { background: none; border: none; color: var(--muted); cursor: pointer; }
        .card-del {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 4px 10px;
            font-size: 10px;
            cursor: pointer;
            z-index: 10;
        }
        .text-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 14px;
            border: 1px solid var(--border);
            position: relative;
        }
        .status-wrap { grid-column: 1/-1; text-align: center; padding: 40px; color: var(--muted); }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin: 0 auto 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #000;
            z-index: 2000;
        }
        .viewer.active { display: flex; flex-direction: column; }
        .viewer-top { position: absolute; top: 0; left: 0; right: 0; padding: 12px; display: flex; justify-content: flex-end; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); z-index: 10; }
        .viewer-close { background: rgba(255,255,255,0.2); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 24px; cursor: pointer; }
        .viewer-img-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
        .viewer-img-wrap img { max-width: 100%; max-height: 100vh; object-fit: contain; transform-origin: center; transition: transform 0.1s ease-out; }
        .viewer-caption { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); color: #fff; padding: 24px 16px 16px; font-size: 13px; text-align: center; }
        .login-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .login-overlay.active { display: flex; }
        .login-box {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            width: 280px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            border: 2px solid var(--border);
            border-radius: 50px;
            background: var(--bg);
            color: var(--text);
            text-align: center;
        }
        .btn-login, .btn-cancel {
            padding: 8px 16px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login { background: var(--accent); color: #fff; flex: 1; }
        .btn-cancel { background: var(--border); color: var(--text); flex: 1; }
        .btn-row { display: flex; gap: 8px; margin-top: 8px; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #fff;
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 12px;
            z-index: 4000;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-brand">မိဘမေတ္တာ <span>အထည်ဆိုင်</span></div>
    <div class="topbar-links">
        <a href="https://t.me/mibamittaa" class="btn-tg" target="_blank"><i class="fab fa-telegram-plane"></i> Telegram</a>
        <button class="btn-vb" onclick="openViber()"><i class="fab fa-viber"></i> Viber</button>
        <button class="btn-dark" onclick="toggleDark()">🌙</button>
    </div>
</div>
<div class="main-wrap">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" alt="Logo" id="adminLogo">
        <h1>မိဘမေတ္တာ <small>အထည်ဆိုင်</small></h1>
        <p>ဆိုင်ကို ကိုယ်တိုင်လာရောက် ကြည့်ရှု ဝယ်နိုင်ပါပြီ</p>
        <div><i class="fas fa-phone"></i> 09697455880 / 09676827963 &nbsp;|&nbsp; <i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</div>
        <div><a href="https://t.me/mibamyitta1" target="_blank">📱 @mibamyitta1</a></div>
    </div>
    <div class="refresh-wrap">
        <button onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>
    <div class="grid" id="postGrid"><div class="status-wrap"><div class="spinner"></div><p>ပုံများ ယူနေပါသည်...</p></div></div>
</div>
<div class="viewer" id="imageViewer">
    <div class="viewer-top"><button class="viewer-close" onclick="closeViewer()">&times;</button></div>
    <div class="viewer-img-wrap"><img id="viewerImage" src=""></div>
    <div class="viewer-caption" id="viewerCaption"></div>
</div>
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <h3>Admin Login</h3>
        <input type="password" id="pinInput" placeholder="Password" onkeypress="if(event.key==='Enter')adminLogin()">
        <div class="btn-row">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p class="login-error" id="loginError" style="display:none; color:red; font-size:11px; margin-top:8px;"></p>
    </div>
</div>
<div class="toast" id="toast"></div>
<script>
    const API = "/api";
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = !!adminToken;
    
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function openViber() { const phone = '09697455880'; if (window.matchMedia('(display-mode: standalone)').matches) { navigator.clipboard.writeText(phone); toast('📞 ' + phone + ' ကူးပြီးပါပြီ'); } else { window.location.href = 'viber://chat?number=%2B959697455880'; } }
    function toggleDark() { let dark = localStorage.getItem('darkMode') === 'true'; dark = !dark; localStorage.setItem('darkMode', dark); if(dark) document.documentElement.setAttribute('data-dark','true'); else document.documentElement.removeAttribute('data-dark'); }
    if(localStorage.getItem('darkMode') === 'true') document.documentElement.setAttribute('data-dark','true');
    function showAdminBar() { document.getElementById('adminBar').innerHTML = '<div class="admin-bar">🔐 Admin Mode <button onclick="adminLogout()">ထွက်မည်</button></div>'; }
    function adminLogout() { adminToken = null; isAdmin = false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML = ''; loadPosts(); toast('🔓 ထွက်ပြီးပါပြီ'); }
    if(isAdmin) showAdminBar();
    document.getElementById('adminLogo').addEventListener('touchstart', () => { setTimeout(() => { document.getElementById('loginOverlay').classList.add('active'); }, 3000); });
    function closeLogin() { document.getElementById('loginOverlay').classList.remove('active'); }
    async function adminLogin() {
        const pw = document.getElementById('pinInput').value;
        const err = document.getElementById('loginError');
        if(!pw) { err.style.display = 'block'; err.textContent = 'Password ထည့်ပါ'; return; }
        try {
            const res = await fetch(API + '/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
            const data = await res.json();
            if(data.success) { adminToken = data.token; localStorage.setItem('adminToken', adminToken); isAdmin = true; closeLogin(); showAdminBar(); loadPosts(); toast('✅ Admin login အောင်မြင်ပါပြီ'); }
            else { err.style.display = 'block'; err.textContent = '❌ Password မှားနေပါသည်'; }
        } catch(e) { err.style.display = 'block'; err.textContent = '❌ ချိတ်ဆက်မှု မအောင်မြင်ပါ'; }
    }
    // ✅ FIXED deletePost function - handles empty response properly
    window.deletePost = async function(postId) {
        console.log("Delete clicked:", postId);
        if(!confirm("ဖျက်မှာလား?")) return;
        if(!adminToken) { toast('Admin login ဝင်ပါ'); return; }
        try {
            const res = await fetch(`/api/post/${postId}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + adminToken } });
            // ✅ First check if response has content
            const text = await res.text();
            let data = {};
            if(text) {
                try { data = JSON.parse(text); } catch(e) { console.warn("Response not JSON:", text); }
            }
            if(res.ok || data.success === true) { 
                loadPosts(); 
                toast('✅ ဖျက်ပြီးပါပြီ'); 
            } else { 
                toast('❌ ဖျက်မရပါ: ' + (data.error || 'Unknown error')); 
            }
        } catch(e) { console.error(e); toast('❌ ချိတ်ဆက်မှု မအောင်မြင်ပါ'); }
    };
    function formatDate(ts) { if(!ts) return ''; const d = new Date(ts*1000); return d.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getFullYear(); }
    function esc(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m; }); }
    async function loadPosts() {
        const grid = document.getElementById('postGrid');
        grid.innerHTML = '<div class="status-wrap"><div class="spinner"></div><p>ပို့စ်များ ယူနေပါသည်...</p></div>';
        try {
            const res = await fetch(API + '/posts');
            const data = await res.json();
            if(!data.success) throw new Error('API Error');
            const posts = data.posts || [];
            if(posts.length === 0) { grid.innerHTML = '<div class="status-wrap"><p>📭 ပုံများ မရှိသေးပါ</p></div>'; return; }
            let html = '';
            for(let post of posts) {
                const delBtn = isAdmin ? `<button class="card-del" onclick="window.deletePost(${post.id})"><i class="fas fa-trash"></i> ဖျက်</button>` : '';
                if(post.type === 'photo') {
                    html += `<div class="card" onclick="openViewer('${post.image_url}','${esc(post.caption || '')}')">${delBtn}<div class="card-img"><img src="${post.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div><div class="card-body"><div class="card-caption">${esc(post.caption || '')}</div><div class="card-footer"><span>${formatDate(post.date)}</span><button class="card-share" onclick="event.stopPropagation();sharePost('photo','${esc(post.caption || '')}')"><i class="fas fa-share-alt"></i></button></div></div></div>`;
                } else {
                    html += `<div class="text-card">${delBtn}<p>${esc(post.text || '')}</p><div class="card-footer"><span>${formatDate(post.date)}</span><button class="card-share" onclick="event.stopPropagation();sharePost('text','${esc(post.text || '')}')"><i class="fas fa-share-alt"></i></button></div></div>`;
                }
            }
            grid.innerHTML = html;
        } catch(e) { grid.innerHTML = '<div class="status-wrap"><p>❌ ချို့ယွင်းနေပါသည်</p><button onclick="loadPosts()" style="margin-top:12px;padding:8px 16px;border-radius:50px;background:var(--accent);color:#fff;border:none;">ပြန်ကြိုးစားမည်</button></div>'; }
    }
    function sharePost(type, text) { if(navigator.share) navigator.share({ title: 'မိဘမေတ္တာ', text: text }); else if(navigator.clipboard) { navigator.clipboard.writeText(text); toast('📋 ကူးပြီးပါပြီ'); } }
    let scale = 1, startDist = 0, startScale = 1;
    function openViewer(src, cap) { const v = document.getElementById('imageViewer'); document.getElementById('viewerImage').src = src; document.getElementById('viewerCaption').innerHTML = cap; scale = 1; document.getElementById('viewerImage').style.transform = 'scale(1)'; v.classList.add('active'); document.body.style.overflow = 'hidden'; history.pushState({viewer:true},'',window.location.href); }
    window.closeViewer = function() { document.getElementById('imageViewer').classList.remove('active'); document.body.style.overflow = ''; scale = 1; };
    const vimg = document.getElementById('viewerImage');
    vimg.addEventListener('touchstart', (e) => { if(e.touches.length===2) { e.preventDefault(); startDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); startScale = scale; } });
    vimg.addEventListener('touchmove', (e) => { if(e.touches.length===2) { e.preventDefault(); const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); scale = Math.min(Math.max(startScale * (dist / startDist), 1), 4); vimg.style.transform = `scale(${scale})`; } });
    window.addEventListener('popstate', () => { if(document.getElementById('imageViewer').classList.contains('active')) window.closeViewer(); });
    loadPosts();
</script>
</body>
</html>

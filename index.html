<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MIBA MYITTA – မိဘမေတ္တာ</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Myanmar Text', system-ui, sans-serif;
            background: #0a0a0f;
            color: #eef0f5;
            padding-bottom: 2rem;
        }

        /* color palette */
        :root {
            --deep-purple: #2d1b2e;
            --grey-black: #1e1a1c;
            --accent-red: #84102d;
            --warm-beige: #b5ac8a;
            --text-glow: #f0e6d0;
        }

        /* glass / card style */
        .glass-card {
            background: rgba(30, 26, 28, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(132, 16, 45, 0.4);
            border-radius: 2rem;
        }

        .topbar {
            padding: 0.8rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #84102d;
        }
        .topbar-inner {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e6d3, #b5ac8a, #84102d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 6px rgba(132,16,45,0.3);
        }
        .nav-icons {
            display: flex;
            gap: 0.8rem;
        }
        .nav-icons a, .nav-icons button {
            background: rgba(132,16,45,0.2);
            border: 1px solid #84102d;
            border-radius: 40px;
            padding: 0.4rem 0.8rem;
            font-size: 1rem;
            color: #b5ac8a;
            cursor: pointer;
        }
        .admin-bar {
            background: #1e1a1c;
            text-align: center;
            padding: 0.3rem;
            font-size: 0.7rem;
            border-bottom: 1px solid #84102d;
        }
        .admin-bar button {
            background: #84102d;
            border: none;
            border-radius: 30px;
            padding: 0.1rem 0.6rem;
            color: white;
            margin-left: 6px;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        .hero {
            margin: 1.2rem 0;
            padding: 1.2rem;
            border-radius: 2rem;
            background: rgba(30, 26, 28, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(132,16,45,0.5);
            text-align: center;
        }
        .hero img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #84102d;
            box-shadow: 0 0 18px rgba(132,16,45,0.5);
        }
        .hero h1 {
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f5e6d3, #b5ac8a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-top: 0.4rem;
        }
        .hero .shop-sub {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #b5ac8a;
        }
        .contact-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
            margin: 0.8rem 0;
            font-size: 0.7rem;
        }
        .telegram-link {
            margin-top: 0.2rem;
        }
        .telegram-link a {
            color: #b5ac8a;
            text-decoration: none;
        }
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 0.8rem;
        }
        .refresh-btn {
            background: rgba(132,16,45,0.2);
            border: 1px solid #84102d;
            border-radius: 40px;
            padding: 0.3rem 1rem;
            color: #b5ac8a;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .card {
            background: rgba(30, 26, 28, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(132,16,45,0.5);
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-3px); border-color: #84102d; box-shadow: 0 8px 20px rgba(132,16,45,0.2); }
        .card-img { aspect-ratio: 4/5; width: 100%; background: #111; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-footer {
            padding: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(132,16,45,0.5);
            font-size: 0.65rem;
        }
        /* three dots menu button */
        .menu-dots {
            background: rgba(132,16,45,0.3);
            border: none;
            border-radius: 30px;
            padding: 0.2rem 0.7rem;
            color: #b5ac8a;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #84102d;
            border-radius: 30px;
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            cursor: pointer;
            z-index: 12;
        }
        .text-card {
            grid-column: 1/-1;
            background: rgba(30, 26, 28, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 1.5rem;
            padding: 1rem;
            position: relative;
        }
        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .viewer.active { display: flex; }
        .viewer-content { position: relative; max-width: 100vw; }
        .viewer-content img { max-width: 100vw; max-height: 100vh; object-fit: contain; }
        .viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #84102d;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: #b5ac8a;
            font-size: 1.2rem;
        }
        .viewer-caption {
            position: absolute;
            bottom: 0;
            background: linear-gradient(transparent, black);
            width: 100%;
            text-align: center;
            padding: 1rem;
            color: white;
        }
        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .login-box {
            background: #1e1a1c;
            border: 1px solid #84102d;
            border-radius: 2rem;
            padding: 1.5rem;
            width: 280px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 8px;
            border-radius: 40px;
            border: 1px solid #84102d;
            background: #2a2528;
            color: white;
        }
        .btn-login, .btn-cancel { flex:1; padding: 6px; border-radius: 40px; border: none; font-weight: 600; cursor: pointer; }
        .btn-login { background: #84102d; color: white; }
        .btn-cancel { background: #333; color: white; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #84102d;
            color: #f5e6d3;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            z-index: 4000;
            opacity: 0;
            transition: 0.2s;
        }
        .skeleton-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .skeleton-card {
            background: rgba(30,26,28,0.5);
            border-radius: 1.5rem;
            aspect-ratio: 4/5;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 0.9; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>
<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA MYITTA</div>
        <div class="nav-icons">
            <a href="https://t.me/mibamittaa" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleDarkMode()"><i class="fas fa-adjust"></i></button>
        </div>
    </div>
</div>
<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" id="adminLogo">
        <h1>မိဘမေတ္တာ<br><span class="shop-sub">အထည်ဆိုင်</span></h1>
        <div class="contact-info">
            <span><i class="fas fa-phone"></i> 09697455880 / 09676827963</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
        <div class="telegram-link"><i class="fab fa-telegram"></i> <a href="https://t.me/mibamyitta1">@mibamyitta1</a></div>
    </div>
    <div class="action-row">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>
    <div id="postGrid" class="product-grid"><div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div></div>
</div>

<div id="imageViewer" class="viewer">
    <div class="viewer-content">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
        <img id="viewerImage" src="">
        <div id="viewerCaption" class="viewer-caption"></div>
    </div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h3>🔐 Admin Login</h3>
        <input type="password" id="pinInput" placeholder="စကားဝှက်">
        <div style="display: flex; gap: 8px;">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p id="loginError" style="color:#b5ac8a; font-size:12px;"></p>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API = "/api";
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = !!adminToken;
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

    function toast(msg) { const t=document.getElementById('toast'); t.innerText=msg; t.style.opacity='1'; setTimeout(()=>t.style.opacity='0',2000); }
    function openViber() { const phone='09697455880'; if(window.matchMedia('(display-mode: standalone)').matches) { navigator.clipboard.writeText(phone); toast('📞 ဖုန်းနံပါတ်ကူးပြီး'); } else window.location.href='viber://chat?number=%2B959697455880'; }
    function toggleDarkMode() { document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'none' : 'invert(1)'; }

    function showAdminBar() { document.getElementById('adminBar').innerHTML='<div class="admin-bar">🔐 Admin Mode <button onclick="adminLogout()">ထွက်မည်</button></div>'; }
    function adminLogout() { adminToken=null; isAdmin=false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML=''; loadPosts(); toast('🔓 ထွက်ပြီး'); }
    if(isAdmin) showAdminBar();

    const logo=document.getElementById('adminLogo');
    let loginTimer;
    logo?.addEventListener('touchstart',()=>{ if(!isAdmin) loginTimer=setTimeout(()=>document.getElementById('loginOverlay').style.display='flex',1000); });
    logo?.addEventListener('touchend',()=>clearTimeout(loginTimer));
    function closeLogin() { document.getElementById('loginOverlay').style.display='none'; }
    async function adminLogin() {
        const pw=document.getElementById('pinInput').value, err=document.getElementById('loginError');
        if(!pw){ err.innerText='စကားဝှက်ထည့်ပါ'; return; }
        try{
            const res=await fetch(API+'/admin/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
            const data=await res.json();
            if(data.success){ adminToken=data.token; localStorage.setItem('adminToken',adminToken); isAdmin=true; closeLogin(); showAdminBar(); loadPosts(); toast('✅ အက်ဒမင်ဝင်ပြီ'); }
            else{ err.innerText='❌ စကားဝှက်မှား'; }
        }catch(e){ err.innerText='❌ ချိတ်ဆက်မှုအမှား'; }
    }

    window.deletePost=async function(postId){
        if(!confirm("ဖျက်မှာလား?")) return;
        if(!adminToken){ toast('Admin login ဝင်ပါ'); return; }
        try{
            const res=await fetch(`/api/delete?id=${postId}`,{ method:'DELETE', headers:{'Authorization':'Bearer '+adminToken} });
            const data=await res.json();
            if(data.success){ loadPosts(); toast('✅ ဖျက်ပြီး'); } else toast('❌ '+ (data.error||'error'));
        }catch(e){ toast('❌ ချိတ်ဆက်မှုမရ'); }
    };

    // share via three dots
    window.shareViaDots = async function(text) {
        try {
            if (navigator.share) await navigator.share({ title: 'မိဘမေတ္တာ', text: text });
            else if (navigator.clipboard) { await navigator.clipboard.writeText(text); toast('📋 ကူးပြီး'); }
            else toast('မျှဝေမရပါ');
        } catch(e) { if(e.name !== 'AbortError') toast('မျှဝေမရပါ'); }
    };

    function formatDate(ts){ if(!ts) return ''; const d=new Date(ts*1000); return `${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getFullYear()}`; }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    async function loadPosts(){
        const grid=document.getElementById('postGrid');
        grid.innerHTML='<div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
        try{
            const res=await fetch(API+'/posts');
            const data=await res.json();
            if(!data.success) throw new Error();
            const posts=data.posts||[];
            if(posts.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem;">📭 ပုံမရှိသေး</div>'; return; }
            let html='';
            posts.forEach(p=>{
                const delBtn=isAdmin?`<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i> ဖျက်</button>`:'';
                if(p.type==='photo'){
                    html+=`<div class="card" onclick="openViewer('${p.image_url}','${escapeHtml(p.caption||'')}')">
                                ${delBtn}
                                <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div>
                                <div class="card-footer">
                                    <span>${formatDate(p.date)}</span>
                                    <button class="menu-dots" onclick="event.stopPropagation(); shareViaDots('${escapeHtml(p.caption||'ပုံ')}')"><i class="fas fa-ellipsis-h"></i></button>
                                </div>
                            </div>`;
                } else {
                    html+=`<div class="text-card">${delBtn}<p>📄 ${escapeHtml(p.text||'')}</p><div class="card-footer"><span>${formatDate(p.date)}</span><button class="menu-dots" onclick="event.stopPropagation(); shareViaDots('${escapeHtml(p.text||'')}')"><i class="fas fa-ellipsis-h"></i></button></div></div>`;
                }
            });
            grid.innerHTML=html;
        } catch(e){ grid.innerHTML='<div style="text-align:center;padding:2rem;">❌ ချို့ယွင်းနေ<br><button onclick="loadPosts()">ပြန်ကြိုးစားမည်</button></div>'; }
    }

    let currentScale=1,startDist=0,startScale=1;
    function openViewer(src,cap){
        const modal=document.getElementById('imageViewer');
        const img=document.getElementById('viewerImage');
        img.src=src; img.style.transform='scale(1)'; currentScale=1;
        document.getElementById('viewerCaption').innerText=cap;
        modal.style.display='flex';
        history.pushState({viewer:true},'');
    }
    window.closeViewer=function(){ document.getElementById('imageViewer').style.display='none'; };
    const viewerImg=document.getElementById('viewerImage');
    viewerImg.addEventListener('touchstart',(e)=>{
        if(e.touches.length===2){
            e.preventDefault();
            const dx=e.touches[0].clientX-e.touches[1].clientX;
            const dy=e.touches[0].clientY-e.touches[1].clientY;
            startDist=Math.hypot(dx,dy);
            startScale=currentScale;
        }
    });
    viewerImg.addEventListener('touchmove',(e)=>{
        if(e.touches.length===2 && startDist>0){
            e.preventDefault();
            const dx=e.touches[0].clientX-e.touches[1].clientX;
            const dy=e.touches[0].clientY-e.touches[1].clientY;
            const newDist=Math.hypot(dx,dy);
            let scale=startScale*(newDist/startDist);
            scale=Math.min(Math.max(scale,1),4);
            viewerImg.style.transform=`scale(${scale})`;
            currentScale=scale;
        }
    });
    viewerImg.addEventListener('touchend',()=>{ startDist=0; });
    window.addEventListener('popstate',()=>{ if(document.getElementById('imageViewer').style.display==='flex') closeViewer(); });
    loadPosts();
</script>
</body>
</html>

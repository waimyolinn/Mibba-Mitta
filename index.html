<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MIBA MYITTA – Neon Morphic</title>
    <meta name="description" content="မိဘမေတ္တာ အထည်ဆိုင် - နီယွန် မော်ဖစ် ဒီဇိုင်း">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a0a1a">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Myanmar Text', system-ui, sans-serif;
            background: radial-gradient(circle at 10% 20%, #0e0e1a, #05050a);
            color: #eef5ff;
            min-height: 100vh;
            padding-bottom: 2rem;
        }

        /* Glassmorphism + Neon */
        .glass-card {
            background: rgba(20, 20, 40, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 2rem;
            box-shadow: 0 8px 24px rgba(0, 255, 255, 0.1), 0 0 12px rgba(0, 255, 255, 0.1);
        }

        .topbar {
            padding: 0.8rem 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 15, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
        }
        .topbar-inner {
            max-width: 640px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 6px rgba(0,255,255,0.4);
        }
        .nav-icons {
            display: flex;
            gap: 1rem;
        }
        .nav-icons a, .nav-icons button {
            background: rgba(0,255,255,0.1);
            border: 1px solid rgba(0,255,255,0.4);
            border-radius: 40px;
            padding: 0.4rem 0.7rem;
            font-size: 1rem;
            cursor: pointer;
            color: #0ff;
            transition: 0.2s;
        }
        .admin-bar {
            background: rgba(0,0,0,0.7);
            text-align: center;
            padding: 0.3rem;
            font-size: 0.7rem;
            font-weight: 500;
            border-bottom: 1px solid cyan;
        }
        .admin-bar button {
            background: cyan;
            color: black;
            border: none;
            border-radius: 30px;
            padding: 0.1rem 0.7rem;
            margin-left: 8px;
            font-weight: bold;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Hero with logo as background */
        .hero {
            margin: 1.5rem 0 1.2rem;
            padding: 1rem;
            border-radius: 2rem;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .hero-bg-logo {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 100px;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }
        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .hero h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.02em;
        }
        .hero .shop-sub {
            font-size: 0.8rem;
            color: #aaf;
            margin-bottom: 0.5rem;
        }
        .contact-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem;
            font-size: 0.7rem;
            margin: 0.8rem 0;
            color: #cce;
        }
        .telegram-link a {
            color: #0ff;
            text-decoration: none;
        }

        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
        }
        .refresh-btn {
            background: rgba(0,255,255,0.1);
            border: 1px solid cyan;
            border-radius: 40px;
            padding: 0.3rem 0.9rem;
            color: cyan;
            font-size: 0.7rem;
            cursor: pointer;
        }

        .product-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .card {
            background: rgba(25, 25, 45, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 255, 0.25);
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            border-color: cyan;
            box-shadow: 0 0 20px rgba(0,255,255,0.2);
        }
        .card-img {
            aspect-ratio: 4 / 5;
            width: 100%;
            background: #111;
        }
        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-footer {
            padding: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(0,255,255,0.3);
            font-size: 0.65rem;
        }
        .share-icon {
            background: none;
            border: none;
            color: cyan;
            cursor: pointer;
        }
        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.7);
            border: 1px solid cyan;
            border-radius: 30px;
            color: white;
            font-size: 0.6rem;
            padding: 2px 8px;
            cursor: pointer;
            z-index: 12;
        }
        .text-card {
            grid-column: 1/-1;
            background: rgba(25,25,45,0.65);
            backdrop-filter: blur(8px);
            border-radius: 1.5rem;
            padding: 1rem;
            border: 1px solid rgba(0,255,255,0.3);
            position: relative;
        }

        .skeleton-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .skeleton-card {
            background: rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            aspect-ratio: 4/5;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 0.8; } 100% { opacity: 0.4; } }

        .viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }
        .viewer.active { display: flex; }
        .viewer-content {
            position: relative;
            max-width: 100vw;
        }
        .viewer-content img {
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
        }
        .viewer-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid cyan;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            color: cyan;
            font-size: 1.2rem;
        }
        .viewer-caption {
            position: absolute;
            bottom: 0;
            background: linear-gradient(transparent, black);
            width: 100%;
            text-align: center;
            padding: 1rem;
            color: white;
        }

        .login-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .login-box {
            background: #111;
            border: 1px solid cyan;
            border-radius: 2rem;
            padding: 1.5rem;
            width: 280px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 8px;
            margin: 12px 0;
            border-radius: 40px;
            border: 1px solid cyan;
            background: #222;
            color: white;
        }
        .btn-login, .btn-cancel {
            padding: 8px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            flex: 1;
        }
        .btn-login { background: cyan; color: black; }
        .btn-cancel { background: #333; color: white; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: cyan;
            color: black;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.7rem;
            z-index: 4000;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }
    </style>
</head>
<body>
<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA MYITTA</div>
        <div class="nav-icons">
            <a href="https://t.me/mibamittaa" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleDarkMode()"><i class="fas fa-adjust"></i></button>
        </div>
    </div>
</div>
<div class="container">
    <div class="hero">
        <div class="hero-content">
            <h1>မိဘမေတ္တာ<br><span class="shop-sub">အထည်ဆိုင်</span></h1>
            <div class="contact-row">
                <span><i class="fas fa-phone"></i> 09697455880 / 09676827963</span>
                <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
            </div>
            <div class="telegram-link">
                <i class="fab fa-telegram"></i> <a href="https://t.me/mibamyitta1" target="_blank">@mibamyitta1</a>
            </div>
        </div>
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" class="hero-bg-logo" alt="bg-logo">
    </div>
    <div class="action-row">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>
    <div id="postGrid" class="product-grid"><div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div></div>
</div>

<div id="imageViewer" class="viewer">
    <div class="viewer-content">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
        <img id="viewerImage" src="">
        <div id="viewerCaption" class="viewer-caption"></div>
    </div>
</div>

<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h3 style="color:cyan">🔐 Admin Login</h3>
        <input type="password" id="pinInput" placeholder="စကားဝှက်">
        <div style="display: flex; gap: 8px;">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p id="loginError" style="color:red; font-size:12px;"></p>
    </div>
</div>
<div id="toast" class="toast"></div>

<script>
    const API = "/api";
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = !!adminToken;

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

    function toast(msg) { const el=document.getElementById('toast'); el.textContent=msg; el.style.opacity='1'; setTimeout(()=>el.style.opacity='0',2000); }
    function toggleDarkMode() { document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'none' : 'invert(1)'; }
    function openViber() {
        const phone='09697455880';
        if(window.matchMedia('(display-mode: standalone)').matches) { navigator.clipboard.writeText(phone); toast('📞 ဖုန်းနံပါတ်ကူးပြီး'); }
        else { window.location.href='viber://chat?number=%2B959697455880'; }
    }

    function showAdminBar() { document.getElementById('adminBar').innerHTML='<div class="admin-bar">🔐 Admin Mode <button onclick="adminLogout()">ထွက်မည်</button></div>'; }
    function adminLogout() { adminToken=null; isAdmin=false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML=''; loadPosts(); toast('🔓 ထွက်ပြီး'); }
    if(isAdmin) showAdminBar();

    const logo=document.querySelector('.hero h1');
    let loginTimer;
    logo?.addEventListener('touchstart',()=>{ if(!isAdmin) loginTimer=setTimeout(()=>{ document.getElementById('loginOverlay').style.display='flex'; },1000); });
    logo?.addEventListener('touchend',()=>clearTimeout(loginTimer));

    function closeLogin() { document.getElementById('loginOverlay').style.display='none'; }
    async function adminLogin() {
        const pw=document.getElementById('pinInput').value;
        const err=document.getElementById('loginError');
        if(!pw){ err.innerText='စကားဝှက်ထည့်ပါ'; return; }
        try{
            const res=await fetch(API+'/admin/login',{ method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw}) });
            const data=await res.json();
            if(data.success){ adminToken=data.token; localStorage.setItem('adminToken',adminToken); isAdmin=true; closeLogin(); showAdminBar(); loadPosts(); toast('✅ အက်ဒမင်ဝင်ပြီ'); }
            else{ err.innerText='❌ စကားဝှက်မှား'; }
        }catch(e){ err.innerText='❌ ချိတ်ဆက်မှုအမှား'; }
    }

    window.deletePost=async function(postId){
        if(!confirm("ဖျက်မှာလား?")) return;
        if(!adminToken){ toast('Admin login ဝင်ပါ'); return; }
        try{
            const res=await fetch(`/api/delete?id=${postId}`,{ method:'DELETE', headers:{'Authorization':'Bearer '+adminToken} });
            const data=await res.json();
            if(data.success){ loadPosts(); toast('✅ ဖျက်ပြီး'); }
            else{ toast('❌ '+ (data.error||'error')); }
        }catch(e){ toast('❌ ချိတ်ဆက်မှုမရ'); }
    };

    function sharePost(text){ if(navigator.share) navigator.share({title:'MIBA MYITTA', text:text}); else if(navigator.clipboard) { navigator.clipboard.writeText(text); toast('📋 ကူးပြီး'); } }
    function formatDate(ts){ if(!ts) return ''; const d=new Date(ts*1000); return `${d.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]} ${d.getFullYear()}`; }
    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    async function loadPosts(){
        const grid=document.getElementById('postGrid');
        grid.innerHTML='<div class="skeleton-grid"><div class="skeleton-card"></div><div class="skeleton-card"></div></div>';
        try{
            const res=await fetch(API+'/posts');
            const data=await res.json();
            if(!data.success) throw new Error();
            const posts=data.posts||[];
            if(posts.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem;">📭 ပုံများမရှိသေး</div>'; return; }
            let html='';
            posts.forEach(p=>{
                const delBtn=isAdmin? `<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i> ဖျက်</button>`:'';
                if(p.type==='photo'){
                    html+=`<div class="card" onclick="openViewer('${p.image_url}', '${escapeHtml(p.caption||'')}')">
                                ${delBtn}
                                <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Error'"></div>
                                <div class="card-footer">
                                    <span>${formatDate(p.date)}</span>
                                    <button class="share-icon" onclick="event.stopPropagation(); sharePost('${escapeHtml(p.caption||'')}')"><i class="fas fa-share-alt"></i></button>
                                </div>
                            </div>`;
                } else {
                    html+=`<div class="text-card">${delBtn}<p>📄 ${escapeHtml(p.text||'')}</p><div class="card-footer"><span>${formatDate(p.date)}</span><button class="share-icon" onclick="event.stopPropagation(); sharePost('${escapeHtml(p.text||'')}')"><i class="fas fa-share-alt"></i></button></div></div>`;
                }
            });
            grid.innerHTML=html;
        } catch(e){ grid.innerHTML='<div style="text-align:center;padding:2rem;">❌ ချို့ယွင်းနေ<br><button onclick="loadPosts()">ပြန်စမ်းမယ်</button></div>'; }
    }

    let currentScale=1,startDist=0,startScale=1;
    function openViewer(src,cap){
        const modal=document.getElementById('imageViewer');
        const img=document.getElementById('viewerImage');
        img.src=src;
        img.style.transform='scale(1)';
        currentScale=1;
        document.getElementById('viewerCaption').innerText=cap;
        modal.style.display='flex';
        history.pushState({viewer:true},'');
    }
    window.closeViewer=function(){ document.getElementById('imageViewer').style.display='none'; };
    const viewerImg=document.getElementById('viewerImage');
    viewerImg.addEventListener('touchstart',(e)=>{
        if(e.touches.length===2){
            e.preventDefault();
            const dx=e.touches[0].clientX-e.touches[1].clientX;
            const dy=e.touches[0].clientY-e.touches[1].clientY;
            startDist=Math.hypot(dx,dy);
            startScale=currentScale;
        }
    });
    viewerImg.addEventListener('touchmove',(e)=>{
        if(e.touches.length===2 && startDist>0){
            e.preventDefault();
            const dx=e.touches[0].clientX-e.touches[1].clientX;
            const dy=e.touches[0].clientY-e.touches[1].clientY;
            const newDist=Math.hypot(dx,dy);
            let scale=startScale*(newDist/startDist);
            scale=Math.min(Math.max(scale,1),4);
            viewerImg.style.transform=`scale(${scale})`;
            currentScale=scale;
        }
    });
    viewerImg.addEventListener('touchend',()=>{ startDist=0; });
    window.addEventListener('popstate',()=>{ if(document.getElementById('imageViewer').style.display==='flex') closeViewer(); });
    loadPosts();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MIBA MYITTA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f051d">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff007a;
            --secondary: #bc13fe;
            --accent: #00f2ff;
            --bg: #0f051d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
            --text-muted: #a0a0a0;
            --neon-shadow: 0 0 15px rgba(255, 0, 122, 0.5);
        }
        [data-theme="light"] {
            --bg: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --glass: rgba(0, 0, 0, 0.05);
            --text: #1a1a1a;
            --text-muted: #666666;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #2a0a4a 0%, var(--bg) 70%);
            color: var(--text);
            transition: all 0.3s;
            overflow-x: hidden;
            min-height: 100vh;
        }
        .topbar {
            position: sticky;
            top: 0;
            background: rgba(15, 5, 29, 0.8);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .topbar-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 1.5rem; letter-spacing: 2px; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: var(--neon-shadow); }
        .nav-icons { display: flex; gap: 1.5rem; align-items: center; }
        .nav-icons a, .nav-icons button { color: var(--text); text-decoration: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; transition: 0.3s; }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 1rem; }
        .hero { text-align: center; padding: 2rem 1rem; position: relative; }
        .hero img { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--primary); margin-bottom: 1rem; box-shadow: 0 0 30px rgba(255, 0, 122, 0.3); }
        .hero h1 { margin: 0; font-size: 2.2rem; font-weight: 900; }
        .shop-sub { font-size: 1.1rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 3px; margin-top: 0.5rem; }
        .contact-info { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.85rem; flex-wrap: wrap; }
        .contact-info span { display: flex; align-items: center; gap: 0.4rem; background: var(--glass); padding: 0.4rem 0.8rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.1); }
        
        .action-row { display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 1rem; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: var(--text); border-left: 4px solid var(--primary); padding-left: 0.8rem; }
        .refresh-btn { background: var(--primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: 0.8rem; font-weight: 600; cursor: pointer; box-shadow: var(--neon-shadow); }
        
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
        .card { background: var(--card-bg); border-radius: 1.2rem; overflow: hidden; position: relative; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .card.selected { border: 3px solid var(--primary); transform: scale(0.95); box-shadow: 0 0 20px var(--primary); }
        .card-img { width: 100%; aspect-ratio: 1/1; overflow: hidden; position: relative; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { padding: 0.8rem; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); position: absolute; bottom: 0; left: 0; right: 0; }
        .card-caption {
            font-size: 0.85rem;
            font-weight: 500;
            color: #a0f0ff;
            text-shadow: 0 0 4px #00ccff;
            letter-spacing: 0.5px;
        }
        
        .time-badge { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); z-index: 5; }

        .text-card { background: var(--card-bg); border-radius: 1.2rem; padding: 1.5rem; border: 1px solid rgba(255,255,255,0.1); grid-column: 1 / -1; backdrop-filter: blur(10px); position: relative; transition: all 0.3s; }
        .text-card.selected { border: 3px solid var(--primary); box-shadow: 0 0 20px var(--primary); }
        
        .delete-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,0,0,0.6); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 10; cursor: pointer; }

        .viewer { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: none; flex-direction: column; backdrop-filter: blur(15px); }
        .viewer-top { position: absolute; top: 0; left: 0; right: 0; padding: 1rem; display: flex; justify-content: space-between; align-items: center; z-index: 2100; }
        .viewer-close, .viewer-save { background: var(--glass); border: 1px solid rgba(255,255,255,0.2); color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        .viewer-save { display: none; }
        .viewer-container { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .viewer-slider { display: flex; flex-direction: column; height: 100%; width: 100%; transition: transform 0.15s ease-out; }
        .viewer-slide { min-height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .viewer-slide img { max-width: 95%; max-height: 85%; object-fit: contain; transition: transform 0.1s ease-out; border-radius: 0.8rem; }
        .viewer-caption { position: absolute; bottom: 30px; left: 15px; right: 15px; background: var(--glass); color: white; padding: 1.2rem; border-radius: 1.2rem; font-size: 0.9rem; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); text-align: center; }

        #loadingScreen { position: fixed; inset: 0; background: var(--bg); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .loading-logo { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--primary); margin-bottom: 1.5rem; box-shadow: 0 0 40px rgba(255, 0, 122, 0.4); animation: pulse 2s infinite; }
        .loading-text { color: #fff; font-weight: 900; letter-spacing: 5px; font-size: 1.3rem; text-shadow: var(--neon-shadow); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 20px; border-radius: 2rem; font-size: 0.9rem; font-weight: 600; z-index: 4000; display: none; box-shadow: var(--neon-shadow); }

        /* Bulk Action Bar */
        #bulkActionBar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            padding: 10px 20px;
            border-radius: 50px;
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .bulk-btn { background: white; color: var(--primary); border: none; padding: 5px 15px; border-radius: 20px; font-weight: bold; cursor: pointer; }
        .bulk-cancel { background: rgba(255,255,255,0.2); color: white; border: none; padding: 5px 15px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="loadingScreen">
    <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" class="loading-logo">
    <div class="loading-text">MIBA MYITTA</div>
</div>

<div id="adminBar"></div>
<div class="topbar">
    <div class="topbar-inner">
        <div class="logo">MIBA MYITTA</div>
        <div class="nav-icons">
            <a href="https://t.me/mibamyitta1" target="_blank"><i class="fab fa-telegram-plane"></i></a>
            <button onclick="openViber()"><i class="fab fa-viber"></i></button>
            <button onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</div>

<div class="container">
    <div class="hero">
        <img src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" id="adminLogo">
        <h1>မိဘမေတ္တာ</h1>
        <div class="shop-sub">အထည်ဆိုင်</div>
        <div class="contact-info">
            <span><i class="fas fa-phone"></i> 09697455880</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းရွာ</span>
        </div>
    </div>
    
    <div class="action-row">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> Refresh</button>
    </div>
    
    <div id="postGrid" class="product-grid"></div>
</div>

<div id="bulkActionBar">
    <span id="selectedCount" style="font-weight:bold; color:white;">0 selected</span>
    <button class="bulk-btn" onclick="confirmBulkDelete()">Delete All</button>
    <button class="bulk-cancel" onclick="cancelSelectMode()">Cancel</button>
</div>

<div id="imageViewer" class="viewer">
    <div class="viewer-top">
        <button class="viewer-close" onclick="closeViewer()">✕</button>
        <button id="appSaveBtn" class="viewer-save" onclick="saveToApp()"><i class="fas fa-download"></i></button>
    </div>
    <div class="viewer-container" id="viewerContainer">
        <div class="viewer-slider" id="viewerSlider"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const API = '/api';
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = !!adminToken;
    let allPosts = [];
    let currentViewerIndex = 0;
    let isZoomed = false;
    let selectedIds = [];

    const isApp = navigator.userAgent.includes('MibaMyittaApp');
    if (isApp) {
        const saveBtn = document.getElementById('appSaveBtn');
        if(saveBtn) saveBtn.style.display = 'flex';
    }

    function toggleTheme() {
        const theme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    }
    if(localStorage.getItem('theme') === 'light') document.body.setAttribute('data-theme', 'light');

    function toast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', 3000);
    }

    function openViber() { window.location.href = "viber://pa?chatURI=mibamyitta"; }

    function showAdminBar() {
        document.getElementById('adminBar').innerHTML = '<div style="background:var(--primary);color:white;text-align:center;padding:5px;font-size:0.8rem;font-weight:bold;">ADMIN MODE <button onclick="adminLogout()" style="background:white;color:black;border:none;border-radius:20px;padding:2px 10px;margin-left:10px;">Exit</button></div>';
    }
    function adminLogout() {
        adminToken = null;
        isAdmin = false;
        localStorage.removeItem('adminToken');
        document.getElementById('adminBar').innerHTML = '';
        cancelSelectMode();
        loadPosts();
        toast('Admin mode disabled');
    }
    if(isAdmin) showAdminBar();

    const logo = document.getElementById('adminLogo');
    let loginTimer;
    logo?.addEventListener('touchstart', () => { 
        if(!isAdmin) loginTimer = setTimeout(async () => {
            const pw = prompt('Admin Password:');
            if(!pw) return;
            try {
                const res = await fetch(API + '/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pw })
                });
                const data = await res.json();
                if(data.success) {
                    adminToken = data.token;
                    localStorage.setItem('adminToken', adminToken);
                    isAdmin = true;
                    showAdminBar();
                    loadPosts();
                    toast('Admin mode enabled');
                } else {
                    toast('Wrong password');
                }
            } catch(e) {
                toast('Login failed');
            }
        }, 3000);
    });
    logo?.addEventListener('touchend', () => clearTimeout(loginTimer));
    logo?.addEventListener('touchmove', () => clearTimeout(loginTimer));

    // Card Click Handling (Select or View)
    function handleCardClick(postId, idx) {
        if (isAdmin) {
            toggleSelect(postId);
        } else {
            openViewer(idx);
        }
    }

    function toggleSelect(postId) {
        const card = document.getElementById(`post-${postId}`);
        if (selectedIds.includes(postId)) {
            selectedIds = selectedIds.filter(id => id !== postId);
            card.classList.remove('selected');
        } else {
            selectedIds.push(postId);
            card.classList.add('selected');
        }
        updateBulkBar();
    }

    function updateBulkBar() {
        const bar = document.getElementById('bulkActionBar');
        const countText = document.getElementById('selectedCount');
        if (selectedIds.length > 0) {
            bar.style.display = 'flex';
            countText.innerText = `${selectedIds.length} selected`;
        } else {
            bar.style.display = 'none';
        }
    }

    function cancelSelectMode() {
        selectedIds = [];
        document.querySelectorAll('.card, .text-card').forEach(c => c.classList.remove('selected'));
        updateBulkBar();
    }

    async function confirmBulkDelete() {
        if (!confirm(`ရွေးထားတဲ့ ${selectedIds.length} ခုလုံးကို ဖျက်မှာ သေချာလား?`)) return;
        if (!adminToken) { toast('Admin login required'); return; }
        
        try {
            const res = await fetch(API + '/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${adminToken}`
                },
                body: JSON.stringify({ ids: selectedIds })
            });
            
            const data = await res.json();
            if (data.success) {
                toast('Deleted successfully');
                cancelSelectMode();
                loadPosts();
            } else {
                toast('Delete failed: ' + data.error);
            }
        } catch (e) {
            toast('Error deleting posts');
        }
    }

    window.deletePost = async (postId) => {
        if(!confirm('ဖျက်မှာ သေချာလား?')) return;
        if(!adminToken) { toast('Admin login required'); return; }
        try {
            const res = await fetch(`${API}/delete?id=${postId}`, {
                method: 'DELETE',
                headers: { 
                    'Authorization': `Bearer ${adminToken}`,
                    'Content-Type': 'application/json'
                }
            });
            const data = await res.json();
            if(data.success) {
                allPosts = allPosts.filter(p => p.id != postId);
                renderPosts();
                toast('Deleted successfully');
            } else {
                toast('Delete failed: ' + (data.error || 'Unknown error'));
            }
        } catch(e) { 
            toast('Network error'); 
        }
    };

    function formatDate(ts) {
        if(!ts) return '';
        const d = new Date(ts * 1000);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
    }

    function escapeHtml(str){ if(!str) return ''; return str.replace(/[&<>]/g, m=> m==='&'?'&amp;': m==='<'?'&lt;':'&gt;'); }

    function renderPosts() {
        const grid=document.getElementById('postGrid');
        if(allPosts.length===0){ grid.innerHTML='<div style="text-align:center;padding:2rem;color:var(--text-muted);">📭 No items</div>'; return; }
        let html='';
        allPosts.forEach((p, idx) => {
            const delBtn = isAdmin ? `<button class="delete-btn" onclick="event.stopPropagation(); window.deletePost(${p.id})"><i class="fas fa-trash"></i></button>` : '';
            const timeStr = formatDate(p.date);
            const isSelected = selectedIds.includes(p.id) ? 'selected' : '';
            
            if(p.type==='photo'){
                html+=`<div class="card ${isSelected}" id="post-${p.id}" onclick="handleCardClick(${p.id}, ${idx})">
                            ${delBtn}
                            <div class="time-badge">${timeStr}</div>
                            <div class="card-img"><img src="${p.image_url}" loading="lazy" onerror="this.src='https://placehold.co/400x500?text=Offline'"></div>
                            <div class="card-info">
                                <div class="card-caption">${escapeHtml(p.caption || '')}</div>
                            </div>
                        </div>`;
            } else {
                html+=`<div class="text-card ${isSelected}" id="post-${p.id}" onclick="handleCardClick(${p.id}, ${idx})">
                            ${delBtn}
                            <div class="time-badge">${timeStr}</div>
                            <div class="card-caption">${escapeHtml(p.text||'')}</div>
                        </div>`;
            }
        });
        grid.innerHTML=html;
    }

    function openViewer(index) {
        if(!allPosts.length) return;
        currentViewerIndex = index;
        const viewer = document.getElementById('imageViewer');
        const slider = document.getElementById('viewerSlider');
        slider.innerHTML = '';
        allPosts.forEach((post, i) => {
            if(post.type !== 'photo') return;
            const slide = document.createElement('div');
            slide.className = 'viewer-slide';
            const img = document.createElement('img');
            img.src = post.image_url;
            img.id = `viewer-img-${i}`;
            img.onerror = function() { this.src = 'https://placehold.co/800x1000?text=Offline+Image'; };
            const cap = document.createElement('div');
            cap.className = 'viewer-caption';
            cap.innerText = post.caption || '';
            slide.appendChild(img);
            slide.appendChild(cap);
            slider.appendChild(slide);
            setupZoom(img);
        });
        slider.style.transform = `translateY(-${currentViewerIndex * 100}%)`;
        viewer.style.display = 'flex';
        history.pushState({viewer:true},'');
    }

    function setupZoom(img) {
        let scale = 1;
        let lastScale = 1;
        let startDist = 0;
        img.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            }
        });
        img.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale = Math.min(Math.max(1, lastScale * (dist / startDist)), 4);
                img.style.transform = `scale(${scale})`;
                isZoomed = scale > 1.05;
            }
        });
        img.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                lastScale = scale;
                if(scale <= 1.1) {
                    scale = 1; lastScale = 1;
                    img.style.transform = `scale(1)`;
                    isZoomed = false;
                }
            }
        });
    }

    window.saveToApp = function() {
        const currentImg = document.querySelector(`#viewer-img-${currentViewerIndex}`);
        if (currentImg && window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'SAVE_IMAGE',
                url: currentImg.src
            }));
        }
    };

    window.closeViewer = function() { 
        document.getElementById('imageViewer').style.display='none'; 
        isZoomed = false;
        document.querySelectorAll('.viewer-slide img').forEach(img => img.style.transform = 'scale(1)');
    };

    async function loadPosts(){
        try{
            // Try fetching from network, Service Worker will handle caching
            const res = await fetch(API+'/posts');
            const data = await res.json();
            if(!data.success) throw new Error('API error');
            allPosts = data.posts || [];
            
            // Save to localStorage as a fallback for pure offline start
            localStorage.setItem('cached_posts', JSON.stringify(allPosts));
            
            renderPosts();
            hideLoading();
        } catch(e){ 
            console.log('Network failed, trying local storage...');
            const cached = localStorage.getItem('cached_posts');
            if(cached) {
                allPosts = JSON.parse(cached);
                renderPosts();
                toast('Offline Mode: Showing cached posts');
                hideLoading();
            } else {
                document.getElementById('postGrid').innerHTML='<div style="text-align:center;padding:2rem;">❌ Offline & No Cache</div>'; 
                hideLoading();
            }
        }
    }

    function hideLoading() {
        setTimeout(() => {
            const ls = document.getElementById('loadingScreen');
            if(ls) {
                ls.style.opacity = '0';
                setTimeout(() => ls.style.display = 'none', 500);
            }
        }, 1000);
    }

    window.addEventListener('popstate', () => { if(document.getElementById('imageViewer').style.display === 'flex') closeViewer(); });
    
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW error', err));
        });
    }
    loadPosts();
</script>
</body>
</html>

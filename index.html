<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>မိဘမေတ္တာ - အထည်ဆိုင်</title>
    
    <meta name="google-site-verification" content="NLqyHByZ-OnqMIKZDidDeUzfNeXN8-SfJElHoPqbrY8" />
    
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="မိဘမေတ္တာ">
    <link rel="apple-touch-icon" href="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="မိဘမေတ္တာ အထည်ဆိုင် - အရည်အသွေးမြင့် အထည်များ">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg: #fafafa;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #f3f4f6;
            --primary: #1a1a1a;
            --accent: #8b5a2b;
            --shadow: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 12px;
            --radius-lg: 16px;
        }
        
        [data-dark="true"] {
            --bg: #0a0a0a;
            --card: #141414;
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --border: #1f1f1f;
            --primary: #fafafa;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', 'Myanmar Text', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ========== TOP NAV ========== */
        .top-nav {
            position: sticky; top: 0; z-index: 50;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(10px);
        }
        .top-nav .logo-text {
            font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.5px;
        }
        .top-nav .logo-text span { color: var(--accent); }
        .top-nav-actions { display: flex; gap: 8px; align-items: center; }
        .top-nav-actions a {
            text-decoration: none; font-size: 13px; font-weight: 600;
            padding: 8px 14px; border-radius: 50px;
            transition: all 0.2s;
        }
        .nav-telegram { background: #0088cc; color: #fff; }
        .nav-viber { background: #7360f2; color: #fff; }
        .dark-toggle {
            background: var(--card); border: 1px solid var(--border);
            width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            font-size: 14px; display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary);
        }
        
        /* ========== ADMIN BAR ========== */
        .admin-bar {
            background: #1a1a2e; color: #fff; text-align: center; padding: 6px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .admin-logout { background: none; border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 3px 10px; border-radius: 50px; font-size: 10px; cursor: pointer; }
        
        /* ========== MAIN CONTAINER ========== */
        .main-container { max-width: 600px; margin: 0 auto; padding: 16px; }
        
        /* ========== HERO ========== */
        .hero-section {
            text-align: center; padding: 24px 16px 16px;
        }
        .hero-logo {
            width: 72px; height: 72px; border-radius: 20px; object-fit: cover;
            margin-bottom: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .hero-title { font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: -1px; }
        .hero-subtitle { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
        .hero-contact {
            display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
            margin-top: 12px;
        }
        .hero-contact span {
            font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px;
        }
        
        /* ========== POSTS GRID ========== */
        .posts-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
            padding-bottom: 40px;
        }
        @media (max-width: 420px) {
            .posts-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
        }
        
        .post-card {
            background: var(--card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .post-card:active { transform: scale(0.98); }
        
        .post-image-wrap {
            aspect-ratio: 3/4;
            overflow: hidden;
            background: #f5f5f5;
            position: relative;
        }
        [data-dark="true"] .post-image-wrap { background: #1a1a1a; }
        .post-image-wrap img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.3s ease;
        }
        .post-image-wrap:active img { transform: scale(1.05); }
        
        .post-info {
            padding: 10px 12px 12px;
        }
        .post-caption {
            font-size: 12px; color: var(--text); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; font-weight: 500;
        }
        .post-meta {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 6px;
        }
        .post-date { font-size: 10px; color: var(--text-muted); }
        .share-btn {
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 12px; padding: 2px 6px;
        }
        
        .delete-btn {
            position: absolute; top: 6px; right: 6px;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            color: #fff; border: none; border-radius: 50px;
            padding: 4px 10px; font-size: 10px; font-weight: 600;
            cursor: pointer; z-index: 10;
        }
        
        /* Text Post */
        .text-post-card {
            background: var(--card); border-radius: var(--radius-lg); padding: 16px;
            box-shadow: var(--shadow); position: relative;
        }
        .text-post-content { font-size: 13px; line-height: 1.7; color: var(--text); }
        
        /* ========== FULL SCREEN VIEWER ========== */
        .viewer-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: #000; z-index: 2000; flex-direction: column;
            touch-action: pan-x pan-y pinch-zoom;
        }
        .viewer-overlay.active { display: flex; }
        .viewer-header {
            position: absolute; top: 0; left: 0; right: 0; z-index: 2001;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px;
            background: linear-gradient(rgba(0,0,0,0.6), transparent);
        }
        .viewer-close {
            background: rgba(255,255,255,0.1); border: none; color: #fff;
            width: 36px; height: 36px; border-radius: 50%; font-size: 22px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .viewer-image-wrap {
            flex: 1; display: flex; align-items: center; justify-content: center;
            overflow: auto; -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y pinch-zoom; padding: 60px 0 0;
        }
        .viewer-image-wrap img {
            width: 100%; height: auto; max-height: none;
            object-fit: contain; touch-action: pan-x pan-y pinch-zoom;
            user-select: none; -webkit-user-select: none;
        }
        .viewer-caption-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: #fff; padding: 24px 16px 20px; font-size: 13px; line-height: 1.6;
            text-align: center;
        }
        .viewer-zoom-hint {
            position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.5); font-size: 10px;
        }
        
        /* ========== STATUS ========== */
        .status-card { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* ========== LOGIN MODAL ========== */
        .login-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
        .login-overlay.active { display: flex; }
        .login-box { background: var(--card); border-radius: var(--radius-lg); padding: 28px 20px; width: 90%; max-width: 340px; text-align: center; }
        .login-box h3 { color: var(--text); font-size: 18px; }
        .login-box input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px; font-size: 15px; text-align: center; outline: none; background: var(--bg); color: var(--text); margin: 14px 0; }
        .login-box .btn-row { display: flex; gap: 8px; }
        .btn-login { flex: 1; background: var(--primary); color: var(--bg); border: none; padding: 10px; border-radius: 50px; font-weight: 600; cursor: pointer; }
        .btn-cancel { flex: 1; background: var(--border); color: var(--text); border: none; padding: 10px; border-radius: 50px; font-weight: 600; cursor: pointer; }
        .login-error { color: #e74c3c; font-size: 11px; margin-top: 8px; display: none; }
        
        /* Toast */
        .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 8px 20px; border-radius: 50px; font-size: 12px; z-index: 4000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        
        /* Refresh */
        .refresh-bar { text-align: center; padding: 8px 0 16px; }
        .refresh-btn { background: var(--card); border: 1px solid var(--border); color: var(--text-secondary); padding: 8px 16px; border-radius: 50px; font-size: 11px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<!-- Admin Bar -->
<div id="adminBar"></div>

<!-- Top Navigation -->
<div class="top-nav">
    <div class="logo-text">မိဘမေတ္တာ <span>အထည်ဆိုင်</span></div>
    <div class="top-nav-actions">
        <a href="https://t.me/mibamittaa" class="nav-telegram" target="_blank" rel="noopener noreferrer"><i class="fab fa-telegram-plane"></i> Telegram</a>
        <a href="viber://chat?number=%2B959697455880" class="nav-viber" target="_blank" rel="noopener noreferrer"><i class="fab fa-viber"></i> Viber</a>
        <button class="dark-toggle" onclick="toggleDarkMode()"><span id="darkIcon"></span></button>
    </div>
</div>

<!-- Main Content -->
<div class="main-container">
    <!-- Hero -->
    <div class="hero-section">
        <img class="hero-logo" src="https://i.ibb.co/35gzXLbQ/IMG-6de218e2feaca195291ffde8799f98ab-V.png" alt="Logo" id="adminLogo">
        <div class="hero-title">မိဘမေတ္တာ</div>
        <div class="hero-subtitle">အရည်အသွေးမြင့် အထည်များ</div>
        <div class="hero-contact">
            <span><i class="fas fa-phone"></i> 09697455880</span>
            <span><i class="fas fa-map-marker-alt"></i> အိုးထိန်းကျေးရွာ</span>
        </div>
    </div>

    <!-- Refresh -->
    <div class="refresh-bar">
        <button class="refresh-btn" onclick="loadPosts()"><i class="fas fa-sync-alt"></i> ပြန်လည်စတင်ရန်</button>
    </div>

    <!-- Posts -->
    <div class="posts-grid" id="postGrid">
        <div class="status-card" style="grid-column:1/-1;"><div class="spinner"></div><p>ပို့စ်များ ယူနေပါသည်...</p></div>
    </div>
</div>

<!-- Full Screen Viewer -->
<div class="viewer-overlay" id="imageViewer">
    <div class="viewer-header">
        <span style="color:#fff;font-size:13px;font-weight:600;">မိဘမေတ္တာ</span>
        <button class="viewer-close" onclick="closeViewer()">&times;</button>
    </div>
    <div class="viewer-image-wrap"><img id="viewerImage" src="" alt="ပုံအကြီး"></div>
    <div class="viewer-caption-bar" id="viewerCaption"></div>
    <div class="viewer-zoom-hint"> လက်နှစ်ချောင်းဖြင့် ချဲ့ကြည့်နိုင်ပါသည်</div>
</div>

<!-- Login Modal -->
<div class="login-overlay" id="loginOverlay">
    <div class="login-box">
        <div style="font-size:36px;"></div>
        <h3>Admin Login</h3>
        <input type="password" id="loginPassword" placeholder="" onkeypress="if(event.key==='Enter')adminLogin()">
        <div class="btn-row">
            <button class="btn-login" onclick="adminLogin()">ဝင်ရောက်မည်</button>
            <button class="btn-cancel" onclick="closeLogin()">ပိတ်မည်</button>
        </div>
        <p class="login-error" id="loginError"></p>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const WORKER_URL = "https://misty-scene-5b01.waimyolinnaoehtein.workers.dev";
    let adminToken = localStorage.getItem('adminToken') || null;
    let isAdmin = adminToken ? true : false;
    let currentScale = 1;
    let initialDist = 0;
    
    // ==================== Service Worker ====================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }
    
    // ==================== Dark Mode ====================
    let darkMode = localStorage.getItem('darkMode') === 'true';
    function applyDarkMode() {
        if (darkMode) {
            document.documentElement.setAttribute('data-dark', 'true');
            document.querySelector('meta[name="theme-color"]').content = '#0a0a0a';
        } else {
            document.documentElement.removeAttribute('data-dark');
            document.querySelector('meta[name="theme-color"]').content = '#1a1a2e';
        }
        document.getElementById('darkIcon').textContent = darkMode ? '' : '';
    }
    function toggleDarkMode() { darkMode = !darkMode; localStorage.setItem('darkMode', darkMode); applyDarkMode(); }
    applyDarkMode();
    
    // ==================== Toast ====================
    function showToast(msg) {
        const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
    
    // ==================== Admin ====================
    if (isAdmin) showAdminBar();
    
    const logo = document.getElementById('adminLogo');
    let longPressTimer;
    logo.addEventListener('touchstart', () => { if(!isAdmin) longPressTimer = setTimeout(showLogin, 3000); });
    logo.addEventListener('touchend', () => clearTimeout(longPressTimer));
    logo.addEventListener('touchmove', () => clearTimeout(longPressTimer));
    
    function showLogin() {
        document.getElementById('loginOverlay').classList.add('active');
        document.getElementById('loginPassword').focus();
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('loginPassword').value = '';
    }
    function closeLogin() { document.getElementById('loginOverlay').classList.remove('active'); }
    
    async function adminLogin() {
        const pw = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');
        if (!pw) { err.style.display = 'block'; err.textContent = 'Password ထည့်ပါ'; return; }
        try {
            const res = await fetch(WORKER_URL + '/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
            const data = await res.json();
            if (data.success) { adminToken = data.token; localStorage.setItem('adminToken', adminToken); isAdmin = true; closeLogin(); showAdminBar(); loadPosts(); }
            else { err.style.display = 'block'; err.textContent = ' Password မှားနေပါသည်'; }
        } catch(e) { err.style.display = 'block'; err.textContent = ' ချိတ်ဆက်မှု မအောင်မြင်ပါ'; }
    }
    
    function showAdminBar() {
        document.getElementById('adminBar').innerHTML = '<div class="admin-bar"> Admin Mode <button class="admin-logout" onclick="adminLogout()">ထွက်မည်</button></div>';
    }
    function adminLogout() { adminToken = null; isAdmin = false; localStorage.removeItem('adminToken'); document.getElementById('adminBar').innerHTML = ''; loadPosts(); }
    
    // ==================== Delete ====================
    async function deletePost(postId) {
        if (!confirm("ဖျက်မှာလား?")) return;
        try {
            const res = await fetch(WORKER_URL + '/post/' + postId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + adminToken } });
            const data = await res.json();
            if (data.success) { loadPosts(); showToast(' ဖျက်ပြီးပါပြီ'); }
            else if (data.error?.includes('ခွင့်မပြု')) { alert("သက်တမ်းကုန်ပါပြီ။"); adminLogout(); }
        } catch(e) { alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ"); }
    }
    
    // ==================== Share ====================
    function sharePost(post) {
        const text = post.type === 'photo' ? (post.caption || 'ပုံ') : (post.text || 'စာသား');
        if (navigator.share) navigator.share({ title: 'မိဘမေတ္တာ', text: text.substring(0, 100) });
        else if (navigator.clipboard) { navigator.clipboard.writeText(text); showToast(' ကူးပြီးပါပြီ'); }
    }
    
    // ==================== Format ====================
    function formatDate(ts) {
        if (!ts) return "";
        const d = new Date(ts * 1000);
        const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return d.getDate() + ' ' + months[d.getMonth()] + ' \'' + d.getFullYear().toString().slice(2);
    }
    function escapeHtml(t) {
        if (!t) return "";
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    
    // ==================== Load Posts ====================
    async function loadPosts() {
        const grid = document.getElementById('postGrid');
        grid.innerHTML = '<div class="status-card" style="grid-column:1/-1;"><div class="spinner"></div><p>ပို့စ်များ ယူနေပါသည်...</p></div>';
        
        try {
            const res = await fetch(WORKER_URL + '/posts');
            const data = await res.json();
            if (!data.success) throw new Error("API Error");
            
            const posts = data.posts || [];
            if (!posts.length) { grid.innerHTML = '<div class="status-card" style="grid-column:1/-1;"><p> ပို့စ်မရှိသေးပါ</p></div>'; return; }
            
            let html = '';
            posts.forEach(function(post) {
                const dateStr = formatDate(post.date);
                const deleteBtn = isAdmin ? '<button class="delete-btn" onclick="event.stopPropagation();deletePost(' + post.id + ')"><i class="fas fa-trash"></i></button>' : '';
                const caption = post.caption || '';
                const safeCaption = escapeHtml(caption);
                
                if (post.type === 'photo') {
                    html += '<div class="post-card" onclick="openViewer(\'' + post.image_url + '\',\'' + safeCaption + '\')">' + deleteBtn + '<div class="post-image-wrap"><img src="' + post.image_url + '" alt="ပုံ" loading="lazy"></div><div class="post-info">' + (caption ? '<div class="post-caption">' + safeCaption + '</div>' : '') + '<div class="post-meta"><span class="post-date">' + dateStr + '</span><button class="share-btn" onclick="event.stopPropagation();sharePost({type:\'photo\',caption:\'' + safeCaption + '\'})"><i class="fas fa-share-alt"></i></button></div></div></div>';
                } else {
                    html += '<div class="text-post-card" style="grid-column:1/-1;">' + deleteBtn + '<div class="text-post-content">' + escapeHtml(post.text || '') + '</div><div class="post-meta" style="margin-top:8px;"><span class="post-date">' + dateStr + '</span><button class="share-btn" onclick="event.stopPropagation();sharePost({type:\'text\',text:\'' + escapeHtml(post.text || '') + '\'})"><i class="fas fa-share-alt"></i></button></div></div>';
                }
            });
            grid.innerHTML = html;
        } catch(e) {
            grid.innerHTML = '<div class="status-card" style="grid-column:1/-1;"><p> ချို့ယွင်းနေပါသည်</p><small>အင်တာနက်စစ်ဆေးပါ</small><br><button class="refresh-btn" onclick="loadPosts()" style="margin-top:10px;"><i class="fas fa-redo"></i> ပြန်ကြိုးစားမည်</button></div>';
        }
    }
    
    // ==================== Image Viewer ====================
    function openViewer(src, caption) {
        const v = document.getElementById('imageViewer');
        document.getElementById('viewerImage').src = src;
        document.getElementById('viewerImage').style.transform = 'scale(1)';
        currentScale = 1;
        document.getElementById('viewerCaption').textContent = caption || '';
        v.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeViewer() {
        document.getElementById('imageViewer').classList.remove('active');
        document.body.style.overflow = '';
    }
    
    document.getElementById('imageViewer').addEventListener('touchstart', e => {
        if (e.touches.length === 2) initialDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }, { passive: true });
    document.getElementById('imageViewer').addEventListener('touchmove', e => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            document.getElementById('viewerImage').style.transform = 'scale(' + Math.min(Math.max(dist / initialDist, 1), 5) + ')';
        }
    }, { passive: false });
    
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
    
    // ==================== Init ====================
    loadPosts();
</script>

</body>
</html>

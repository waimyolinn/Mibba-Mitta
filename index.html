<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>မိဘမေတ္တာ - အထည်ဆိုင်</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="မိဘမေတ္တာ">
    <meta name="theme-color" content="#8b5a2b">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%238b5a2b'/%3E%3Ctext x='50' y='68' text-anchor='middle' fill='white' font-size='50'%3E🧵%3C/text%3E%3C/svg%3E">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Myanmar Text', -apple-system, sans-serif;
            background: linear-gradient(135deg, #fdf8f0 0%, #f5e6d3 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .shop-info { text-align: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #f0dcc5; }
        .shop-name { font-size: 28px; font-weight: bold; color: #8b5a2b; }
        .welcome-message { color: #b8863f; font-size: 18px; font-weight: bold; margin: 15px 0; padding: 8px; background: #fef5e8; border-radius: 50px; }
        .shop-address { font-size: 13px; color: #7a5a4e; background: #fef5e8; padding: 10px; border-radius: 20px; margin-top: 10px; }
        .social-buttons { margin-bottom: 25px; }
        .btn { display: block; text-align: center; padding: 14px; border-radius: 50px; text-decoration: none; font-weight: bold; color: white; margin: 10px 0; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.02); }
        .telegram { background: #0088cc; }
        .viber { background: #7360f2; }
        
        /* Install Banner */
        .install-banner {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: #8b5a2b;
            color: white;
            padding: 15px 20px;
            border-radius: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .install-banner button {
            background: white;
            color: #8b5a2b;
            border: none;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 10px;
        }
        .install-banner .close-banner {
            background: none;
            color: white;
            font-size: 22px;
            cursor: pointer;
            padding: 0 5px;
            margin-left: 10px;
        }
        
        .post-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .post-image { width: 100%; display: block; }
        .post-content { padding: 15px; }
        .post-text { padding: 18px; font-size: 16px; color: #4a3520; line-height: 1.5; }
        .post-caption { font-size: 15px; color: #5a3e2e; margin-bottom: 8px; }
        .post-date { font-size: 11px; color: #a08060; margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(220, 20, 60, 0.9);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            z-index: 10;
        }
        .admin-badge {
            background: #c0392b;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 15px;
        }
        .status-message { text-align: center; padding: 40px; color: #8b5a2b; background: #fef5e8; border-radius: 20px; }
        .loading-spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #ddd; border-top-color: #8b5a2b; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .refresh-btn { background: #8b5a2b; color: white; border: none; padding: 10px 24px; border-radius: 40px; font-size: 14px; font-weight: bold; cursor: pointer; display: block; margin: 0 auto 25px auto; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; cursor: pointer; justify-content: center; align-items: center; }
        .modal-content { max-width: 95%; max-height: 90%; object-fit: contain; }
        .modal-caption { text-align: center; color: white; padding: 15px; font-size: 14px; background: rgba(0,0,0,0.7); position: fixed; bottom: 0; left: 0; right: 0; }
        .close-modal { position: fixed; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

<div class="container">
    <div class="shop-info">
        <div class="shop-name">🧵 မိဘမေတ္တာ <small>အထည်ဆိုင်</small></div>
        <div class="welcome-message">🙏 မင်္ဂလာပါ မိမိတို့ဆိုင်သို့ ကြိုဆိုပါတယ် 🙏</div>
        <div class="shop-address">
            <p>📞 ဆက်သွယ်ရန် - 09697455880</p>
            <p>📍 လိပ်စာ - အိုးထိန်းကျေးရွာ၊ ပုသိမ်-မုံရွာ ကားလမ်းဘေး</p>
        </div>
    </div>

    <div class="social-buttons">
        <a href="https://t.me/mibamittaa" class="btn telegram" target="_blank">📱 Telegram Channel</a>
        <a href="viber://chat?number=%2B959697455880" class="btn viber">💬 Viber</a>
    </div>

    <div id="adminPanel"></div>
    
    <button class="refresh-btn" id="refreshBtn">🔄 ပို့စ်များ ပြန်လည်စတင်ရန်</button>

    <div id="postGrid">
        <div class="status-message"><span class="loading-spinner"></span> ပို့စ်များ ယူနေပါသည်...</div>
    </div>
</div>

<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-modal">&times;</span>
    <img class="modal-content" id="modalImage">
    <div id="modalCaption" class="modal-caption"></div>
</div>

<script>
    const WORKER_URL = "https://misty-scene-5b01.waimyolinnaoehtein.workers.dev";
    
    // ========== PWA Installation (အောက်ခြေ Banner) ==========
    let deferredPrompt;
    let installBanner = null;
    
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallBanner();
    });
    
    function showInstallBanner() {
        if (installBanner) return;
        if (window.matchMedia('(display-mode: standalone)').matches) return;
        
        installBanner = document.createElement('div');
        installBanner.className = 'install-banner';
        installBanner.innerHTML = `
            <span style="flex:1;">📲 မိဘမေတ္တာ App ထည့်ပါ</span>
            <button id="installNowBtn">Install</button>
            <span class="close-banner" id="closeBannerBtn">✕</span>
        `;
        document.body.appendChild(installBanner);
        
        document.getElementById('installNowBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    if (installBanner) installBanner.remove();
                    installBanner = null;
                }
                deferredPrompt = null;
            }
        });
        
        document.getElementById('closeBannerBtn').addEventListener('click', () => {
            if (installBanner) installBanner.remove();
            installBanner = null;
        });
    }
    // ================================================
    
    // Admin Check
    const urlParams = new URLSearchParams(window.location.search);
    const isAdminMode = urlParams.has('admin');
    const urlPassword = urlParams.get('pwd');
    let isAdmin = false;
    
    if (isAdminMode && urlPassword === "admin123") {
        isAdmin = true;
        document.getElementById('adminPanel').innerHTML = '<div class="admin-badge">🔐 Admin Mode (ဖျက်ခွင့်ရှိတယ်)</div>';
    }

    function formatDate(timestamp) {
        if (!timestamp) return "ရက်စွဲမရှိ";
        const date = new Date(timestamp * 1000);
        return `${date.getDate().toString().padStart(2,'0')}/${(date.getMonth()+1).toString().padStart(2,'0')}/${date.getFullYear()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
    }

    function escapeHtml(text) {
        if (!text) return "";
        return text.replace(/[&<>]/g, m => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
    }

    async function deletePost(postId) {
        if (!confirm("ဒီပို့စ်ကို ဖျက်မှာလား?")) return;
        
        try {
            const response = await fetch(`${WORKER_URL}/post/${postId}`, { method: 'DELETE' });
            const data = await response.json();
            if (data.success) {
                alert("✅ ဖျက်ပြီးပါပြီ");
                loadPosts();
            } else {
                alert("❌ ဖျက်လို့မရပါ");
            }
        } catch(error) {
            alert("❌ ဖျက်လို့မရပါ");
        }
    }

    async function loadPosts() {
        const grid = document.getElementById('postGrid');
        grid.innerHTML = '<div class="status-message"><span class="loading-spinner"></span> ပို့စ်များ ယူနေပါသည်...</div>';
        
        try {
            const response = await fetch(`${WORKER_URL}/posts`);
            const data = await response.json();
            if (!data.success) throw new Error("API error");
            
            const posts = data.posts;
            if (!posts || posts.length === 0) {
                grid.innerHTML = '<div class="status-message">📭 လက်ရှိပို့စ်များ မရှိသေးပါ</div>';
                return;
            }
            
            let html = '';
            for (const post of posts) {
                const dateStr = formatDate(post.date);
                const deleteBtn = isAdmin ? `<button class="delete-btn" onclick="deletePost(${post.id})">✕ ဖျက်ရန်</button>` : '';
                
                if (post.type === 'photo') {
                    html += `
                        <div class="post-card">
                            ${deleteBtn}
                            <img class="post-image" src="${post.image_url}" onclick="openModal('${post.image_url}', '${escapeHtml(post.caption)}')">
                            <div class="post-content">
                                ${post.caption ? `<div class="post-caption">📝 ${escapeHtml(post.caption)}</div>` : ''}
                                <div class="post-date">📅 ${dateStr}</div>
                            </div>
                        </div>
                    `;
                } else if (post.type === 'text') {
                    html += `
                        <div class="post-card">
                            ${deleteBtn}
                            <div class="post-text">
                                💬 ${escapeHtml(post.text)}
                                <div class="post-date">📅 ${dateStr}</div>
                            </div>
                        </div>
                    `;
                }
            }
            grid.innerHTML = html;
        } catch(error) {
            grid.innerHTML = '<div class="status-message">❌ နည်းပညာချို့ယွင်းနေပါသည်။</div>';
        }
    }

    function openModal(src, caption) {
        const modal = document.getElementById('imageModal');
        modal.style.display = "flex";
        document.getElementById('modalImage').src = src;
        document.getElementById('modalCaption').textContent = caption || "";
    }
    
    function closeModal() {
        document.getElementById('imageModal').style.display = "none";
    }

    document.getElementById('refreshBtn').addEventListener('click', loadPosts);
    loadPosts();
</script>

</body>
</html>
